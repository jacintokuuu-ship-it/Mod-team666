name: Build External ESP iOS

on:
  workflow_dispatch:

permissions:
  contents: read

env:
  THEOS: ${{ github.workspace }}/theos
  SOURCE_ZIP: LGL-Inspired-Ultimate-Standoff2-Players-v3-buildfixed.zip
  SDK_VERSION: "16.5"
  MIN_IOS: "14.0"

jobs:
  build:
    name: Build External ESP iOS
    runs-on: macos-15

    steps:

      # ============================================================
      # CHECKOUT
      # ============================================================
      - name: Checkout repository
        uses: actions/checkout@v5


      # ============================================================
      # LOCALIZAR E EXTRAIR ZIP
      # ============================================================
      - name: Locate and extract ZIP
        shell: bash
        run: |
          set -Eeuo pipefail

          echo "=============================================="
          echo " LOCALIZANDO PROJETO"
          echo "=============================================="

          ZIP_PATH=""

          if [ -f "$GITHUB_WORKSPACE/$SOURCE_ZIP" ]; then
            ZIP_PATH="$GITHUB_WORKSPACE/$SOURCE_ZIP"
          else
            ZIP_PATH="$(
              find "$GITHUB_WORKSPACE" \
                -type f \
                -name "$SOURCE_ZIP" \
                -print \
                -quit
            )"
          fi

          if [ -z "$ZIP_PATH" ]; then
            echo "::error::ZIP não encontrado: $SOURCE_ZIP"
            echo ""
            echo "ZIPs encontrados no repositório:"
            find "$GITHUB_WORKSPACE" \
              -type f \
              -iname "*.zip" \
              -print \
              | sort
            exit 1
          fi

          echo "ZIP encontrado:"
          echo "$ZIP_PATH"

          rm -rf "$GITHUB_WORKSPACE/source"

          mkdir -p "$GITHUB_WORKSPACE/source"

          echo ""
          echo "Extraindo..."

          unzip -q \
            "$ZIP_PATH" \
            -d "$GITHUB_WORKSPACE/source"

          echo ""
          echo "Procurando makefile..."

          PROJECT_MAKEFILE="$(
            find "$GITHUB_WORKSPACE/source" \
              -type f \
              \( -iname "Makefile" -o -iname "makefile" \) \
              -print \
              -quit
          )"

          if [ -z "$PROJECT_MAKEFILE" ]; then
            echo "::error::Nenhum Makefile/makefile encontrado."

            echo ""
            echo "Estrutura encontrada:"
            find "$GITHUB_WORKSPACE/source" \
              -maxdepth 6 \
              -print \
              | sort

            exit 1
          fi

          PROJECT_DIR="$(dirname "$PROJECT_MAKEFILE")"

          echo ""
          echo "Makefile:"
          echo "$PROJECT_MAKEFILE"

          echo ""
          echo "Diretório:"
          echo "$PROJECT_DIR"

          echo "APP_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"


      # ============================================================
      # XCODE
      # ============================================================
      - name: Configure Xcode
        shell: bash
        run: |
          set -Eeuo pipefail

          echo "=============================================="
          echo " XCODE"
          echo "=============================================="

          echo ""
          echo "Xcode selecionado:"
          xcode-select -p

          echo ""
          echo "Versão:"
          xcodebuild -version

          echo ""
          echo "SDKs oficiais disponíveis:"
          xcodebuild -showsdks


      # ============================================================
      # DEPENDÊNCIAS
      # ============================================================
      - name: Install dependencies
        shell: bash
        run: |
          set -Eeuo pipefail

          echo "=============================================="
          echo " DEPENDÊNCIAS"
          echo "=============================================="

          if ! command -v ldid >/dev/null 2>&1; then
            echo "Instalando ldid..."
            brew install ldid
          else
            echo "ldid já instalado."
          fi

          echo ""
          echo "ldid:"
          command -v ldid

          echo ""
          echo "Versão:"
          ldid -V || true


      # ============================================================
      # THEOS
      # ============================================================
      - name: Install Theos
        shell: bash
        run: |
          set -Eeuo pipefail

          echo "=============================================="
          echo " THEOS"
          echo "=============================================="

          rm -rf "$THEOS"

          git clone \
            --recursive \
            --depth 1 \
            https://github.com/theos/theos.git \
            "$THEOS"

          git -C "$THEOS" \
            submodule update \
            --init \
            --recursive

          if [ ! -f "$THEOS/makefiles/common.mk" ]; then
            echo "::error::Theos não foi instalado corretamente."
            exit 1
          fi

          echo "$THEOS/bin" >> "$GITHUB_PATH"

          echo ""
          echo "Theos instalado em:"
          echo "$THEOS"

          echo ""
          echo "Commit:"
          git -C "$THEOS" rev-parse --short HEAD


      # ============================================================
      # SDK 16.5
      # ============================================================
      - name: Install iPhoneOS SDK 16.5
        shell: bash
        run: |
          set -Eeuo pipefail

          echo "=============================================="
          echo " IPHONEOS SDK $SDK_VERSION"
          echo "=============================================="

          SDK_REPO="$GITHUB_WORKSPACE/theos-sdks"

          rm -rf "$SDK_REPO"

          git clone \
            --depth 1 \
            https://github.com/theos/sdks.git \
            "$SDK_REPO"

          SDK_SOURCE="$SDK_REPO/iPhoneOS${SDK_VERSION}.sdk"
          SDK_DEST="$THEOS/sdks/iPhoneOS${SDK_VERSION}.sdk"

          if [ ! -d "$SDK_SOURCE" ]; then
            echo "::error::SDK iPhoneOS${SDK_VERSION}.sdk não encontrado."

            echo ""
            echo "SDKs disponíveis no repositório:"
            find "$SDK_REPO" \
              -maxdepth 1 \
              -type d \
              -name "iPhoneOS*.sdk" \
              -print \
              | sort

            exit 1
          fi

          mkdir -p "$THEOS/sdks"

          rm -rf "$SDK_DEST"

          cp -R \
            "$SDK_SOURCE" \
            "$THEOS/sdks/"

          if [ ! -d "$SDK_DEST" ]; then
            echo "::error::Falha ao copiar SDK."
            exit 1
          fi

          echo ""
          echo "SDK instalado:"
          ls -ld "$SDK_DEST"


      # ============================================================
      # VALIDAR THEOS + SDK
      # ============================================================
      - name: Validate Theos and SDK
        shell: bash
        run: |
          set -Eeuo pipefail

          echo "=============================================="
          echo " VALIDAÇÃO"
          echo "=============================================="

          test -f "$THEOS/makefiles/common.mk"
          test -f "$THEOS/makefiles/application.mk"
          test -d "$THEOS/sdks/iPhoneOS${SDK_VERSION}.sdk"

          echo ""
          echo "THEOS:"
          echo "$THEOS"

          echo ""
          echo "SDK:"
          ls -ld \
            "$THEOS/sdks/iPhoneOS${SDK_VERSION}.sdk"


      # ============================================================
      # VALIDAR PROJETO
      # ============================================================
      - name: Validate project
        working-directory: ${{ env.APP_DIR }}
        shell: bash
        run: |
          set -Eeuo pipefail

          echo "=============================================="
          echo " PROJETO"
          echo "=============================================="

          echo ""
          echo "Diretório:"
          pwd

          echo ""
          echo "Arquivos principais:"
          find . \
            -maxdepth 3 \
            -type f \
            | sort

          echo ""
          echo "=============================================="
          echo " MAKEFILE"
          echo "=============================================="

          cat makefile


      # ============================================================
      # COMPILAR + EMPACOTAR
      # ============================================================
      - name: Build project
        working-directory: ${{ env.APP_DIR }}
        shell: bash
        run: |
          set -Eeuo pipefail

          echo "=============================================="
          echo " BUILD"
          echo "=============================================="

          echo ""
          echo "Projeto:"
          pwd

          echo ""
          echo "THEOS:"
          echo "$THEOS"

          echo ""
          echo "SDK:"
          echo "$SDK_VERSION"

          echo ""
          echo "iOS mínimo:"
          echo "$MIN_IOS"

          echo ""
          echo "Limpando build anterior..."

          make clean || true

          echo ""
          echo "Compilando e empacotando..."

          make package \
            SDKVERSION="$SDK_VERSION" \
            FINALPACKAGE=1 \
            DEBUG=0 \
            messages=yes \
            2>&1 | tee "$GITHUB_WORKSPACE/build.log"

          echo ""
          echo "Build finalizado."


      # ============================================================
      # LOCALIZAR TIPA
      # ============================================================
      - name: Locate TIPA
        working-directory: ${{ env.APP_DIR }}
        shell: bash
        run: |
          set -Eeuo pipefail

          echo "=============================================="
          echo " PROCURANDO TIPA"
          echo "=============================================="

          TIPA="$(
            find "$PWD/packages" \
              -maxdepth 1 \
              -type f \
              -name "*.tipa" \
              -print \
              -quit
          )"

          if [ -z "$TIPA" ]; then
            echo "::error::Nenhum .tipa foi gerado."

            echo ""
            echo "Conteúdo do projeto:"
            find "$PWD" \
              -maxdepth 5 \
              -print \
              | sort

            exit 1
          fi

          TIPA_NAME="$(basename "$TIPA")"

          echo ""
          echo "TIPA encontrado:"
          echo "$TIPA"

          echo ""
          echo "Nome:"
          echo "$TIPA_NAME"

          echo "TIPA_PATH=$TIPA" >> "$GITHUB_ENV"
          echo "TIPA_NAME=$TIPA_NAME" >> "$GITHUB_ENV"


      # ============================================================
      # CRIAR IPA
      # ============================================================
      - name: Create IPA
        shell: bash
        run: |
          set -Eeuo pipefail

          echo "=============================================="
          echo " CRIANDO IPA"
          echo "=============================================="

          rm -rf "$GITHUB_WORKSPACE/ipa_extract"
          rm -rf "$GITHUB_WORKSPACE/output"

          mkdir -p \
            "$GITHUB_WORKSPACE/ipa_extract" \
            "$GITHUB_WORKSPACE/output"

          echo ""
          echo "Extraindo TIPA..."

          unzip -q \
            "$TIPA_PATH" \
            -d "$GITHUB_WORKSPACE/ipa_extract"

          if [ ! -d "$GITHUB_WORKSPACE/ipa_extract/Payload" ]; then
            echo "::error::TIPA não contém Payload."
            exit 1
          fi

          APP="$(
            find "$GITHUB_WORKSPACE/ipa_extract/Payload" \
              -maxdepth 1 \
              -type d \
              -name "*.app" \
              -print \
              -quit
          )"

          if [ -z "$APP" ]; then
            echo "::error::Nenhum .app encontrado dentro do TIPA."
            exit 1
          fi

          APP_NAME="$(basename "$APP" .app)"

          echo ""
          echo "APP:"
          echo "$APP"

          echo ""
          echo "Nome:"
          echo "$APP_NAME"

          echo ""
          echo "Criando IPA..."

          rm -rf \
            "$GITHUB_WORKSPACE/output/Payload"

          mkdir -p \
            "$GITHUB_WORKSPACE/output/Payload"

          cp -R \
            "$APP" \
            "$GITHUB_WORKSPACE/output/Payload/$APP_NAME.app"

          cd "$GITHUB_WORKSPACE/output"

          /usr/bin/ditto \
            -c \
            -k \
            --sequesterRsrc \
            --keepParent \
            Payload \
            "$APP_NAME.ipa"

          if [ ! -s "$APP_NAME.ipa" ]; then
            echo "::error::IPA não foi criada."
            exit 1
          fi

          echo ""
          echo "IPA criada:"
          echo "$GITHUB_WORKSPACE/output/$APP_NAME.ipa"

          echo ""
          echo "Tamanho:"
          ls -lh "$APP_NAME.ipa"

          echo ""
          echo "SHA256:"
          shasum -a 256 "$APP_NAME.ipa"

          echo ""
          echo "TIPA original:"
          cp \
            "$TIPA_PATH" \
            "$GITHUB_WORKSPACE/output/$TIPA_NAME"

          echo ""
          echo "Arquivos finais:"
          ls -lh "$GITHUB_WORKSPACE/output"


      # ============================================================
      # UPLOAD IPA + TIPA
      # ============================================================
      - name: Upload IPA and TIPA
        uses: actions/upload-artifact@v4
        with:
          name: External-ESP-iOS-Build
          path: |
            output/*.ipa
            output/*.tipa
          if-no-files-found: error
          retention-days: 14


      # ============================================================
      # UPLOAD LOGS
      # ============================================================
      - name: Upload build log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: External-ESP-build-log
          path: |
            build.log
            source/**/.theos/log/**
            source/**/.theos/obj/**
          if-no-files-found: ignore
          retention-days: 7
