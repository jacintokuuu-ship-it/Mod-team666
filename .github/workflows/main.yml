name: Build TrollStore TIPA

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - master

permissions:
  contents: read

env:
  THEOS: ${{ github.workspace }}/theos
  SDK_VERSION: "15.6"

jobs:
  build:
    name: Build iOS arm64e
    runs-on: macos-14

    steps:

      # ============================================================
      # 1. BAIXAR O REPOSITÓRIO
      # ============================================================
      - name: Checkout repository
        uses: actions/checkout@v4

      # ============================================================
      # 2. LOCALIZAR O ZIP DO PROJETO
      # ============================================================
      - name: Locate source ZIP
        shell: bash
        run: |
          set -e

          echo "Arquivos do repositório:"
          find "$GITHUB_WORKSPACE" -maxdepth 2 -type f -print

          ZIP_COUNT=$(find "$GITHUB_WORKSPACE" -maxdepth 1 -type f -name "*.zip" | wc -l | tr -d ' ')

          if [ "$ZIP_COUNT" -eq 0 ]; then
            echo "::error::Nenhum ZIP encontrado na raiz do repositório."
            exit 1
          fi

          if [ "$ZIP_COUNT" -gt 1 ]; then
            echo "::error::Mais de um ZIP encontrado na raiz."
            find "$GITHUB_WORKSPACE" -maxdepth 1 -type f -name "*.zip"
            exit 1
          fi

          SOURCE_ZIP=$(find "$GITHUB_WORKSPACE" -maxdepth 1 -type f -name "*.zip" | head -n 1)

          echo "ZIP encontrado:"
          echo "$SOURCE_ZIP"

          echo "SOURCE_ZIP=$SOURCE_ZIP" >> "$GITHUB_ENV"

      # ============================================================
      # 3. EXTRAIR PROJETO
      # ============================================================
      - name: Extract project
        shell: bash
        run: |
          set -e

          rm -rf "$GITHUB_WORKSPACE/project"

          mkdir -p "$GITHUB_WORKSPACE/project"

          unzip -q "$SOURCE_ZIP" \
            -d "$GITHUB_WORKSPACE/project"

          echo "Conteúdo extraído:"
          find "$GITHUB_WORKSPACE/project" -maxdepth 4 -print

      # ============================================================
      # 4. LOCALIZAR MAKEFILE
      # ============================================================
      - name: Locate Theos project
        shell: bash
        run: |
          set -e

          MAKEFILE=$(find "$GITHUB_WORKSPACE/project" \
            -type f \
            -name "Makefile" \
            -print -quit)

          if [ -z "$MAKEFILE" ]; then
            echo "::error::Makefile não encontrado dentro do ZIP."
            exit 1
          fi

          PROJECT_DIR=$(dirname "$MAKEFILE")

          echo "Makefile:"
          echo "$MAKEFILE"

          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"

      # ============================================================
      # 5. MOSTRAR ESTRUTURA DO PROJETO
      # ============================================================
      - name: Inspect project
        shell: bash
        run: |
          set -e

          echo "PROJECT_DIR:"
          echo "$PROJECT_DIR"

          echo
          echo "Estrutura:"
          find "$PROJECT_DIR" -maxdepth 5 -print

      # ============================================================
      # 6. INSTALAR DEPENDÊNCIAS
      # ============================================================
      - name: Install dependencies
        shell: bash
        run: |
          set -e

          brew update

          brew install ldid xz

          echo
          echo "ldid:"
          ldid -h >/dev/null 2>&1 || true

      # ============================================================
      # 7. INSTALAR THEOS
      # ============================================================
      - name: Install Theos
        shell: bash
        run: |
          set -e

          rm -rf "$THEOS"

          git clone --recursive \
            https://github.com/theos/theos.git \
            "$THEOS"

          echo "Theos instalado em:"
          echo "$THEOS"

      # ============================================================
      # 8. BAIXAR REPOSITÓRIO DE SDKs
      # ============================================================
      - name: Download Theos SDK repository
        shell: bash
        run: |
          set -e

          rm -rf "$GITHUB_WORKSPACE/theos-sdks"

          git clone \
            https://github.com/theos/sdks.git \
            "$GITHUB_WORKSPACE/theos-sdks"

      # ============================================================
      # 9. INSTALAR SDK 15.6
      # ============================================================
      - name: Install iPhoneOS 15.6 SDK
        shell: bash
        run: |
          set -e

          SDK_SOURCE="$GITHUB_WORKSPACE/theos-sdks/iPhoneOS15.6.sdk"
          SDK_DEST="$THEOS/sdks/iPhoneOS15.6.sdk"

          if [ ! -d "$SDK_SOURCE" ]; then
            echo "::error::iPhoneOS15.6.sdk não encontrado no repositório de SDKs."
            echo "SDKs disponíveis:"
            find "$GITHUB_WORKSPACE/theos-sdks" \
              -maxdepth 1 \
              -type d \
              -name "iPhoneOS*.sdk" \
              -print
            exit 1
          fi

          rm -rf "$SDK_DEST"

          cp -R "$SDK_SOURCE" "$SDK_DEST"

          echo
          echo "SDK instalado:"
          ls -ld "$SDK_DEST"

      # ============================================================
      # 10. VALIDAR SDK
      # ============================================================
      - name: Validate SDK
        shell: bash
        run: |
          set -e

          SDK="$THEOS/sdks/iPhoneOS${SDK_VERSION}.sdk"

          if [ ! -d "$SDK" ]; then
            echo "::error::SDK não existe: $SDK"
            exit 1
          fi

          echo "SDK encontrado:"
          echo "$SDK"

          echo
          echo "SDKs disponíveis:"
          find "$THEOS/sdks" \
            -maxdepth 1 \
            -type d \
            -name "iPhoneOS*.sdk" \
            -print

      # ============================================================
      # 11. CORRIGIR SDK ANTIGO NO MAKEFILE
      # ============================================================
      - name: Normalize Makefile SDK
        shell: bash
        run: |
          set -e

          cd "$PROJECT_DIR"

          echo "Makefile antes:"
          grep -n "TARGET" Makefile || true

          sed -i '' \
            's/iphone:clang:[0-9][0-9.]*:/iphone:clang:15.6:/g' \
            Makefile

          echo
          echo "Makefile depois:"
          grep -n "TARGET" Makefile || true

      # ============================================================
      # 12. VERIFICAR INFO.PLIST DO PROJETO
      # ============================================================
      - name: Validate source Info.plist
        shell: bash
        run: |
          set -e

          INFO_PLIST=$(find "$PROJECT_DIR" \
            -type f \
            -path "*/layout/*.app/Info.plist" \
            -print -quit)

          if [ -z "$INFO_PLIST" ]; then
            INFO_PLIST=$(find "$PROJECT_DIR" \
              -type f \
              -name "Info.plist" \
              -print -quit)
          fi

          if [ -z "$INFO_PLIST" ]; then
            echo "::error::Info.plist não encontrado."
            exit 1
          fi

          echo "Info.plist encontrado:"
          echo "$INFO_PLIST"

          plutil -lint "$INFO_PLIST"

          echo
          echo "Bundle executable:"
          /usr/libexec/PlistBuddy \
            -c "Print :CFBundleExecutable" \
            "$INFO_PLIST" || true

          echo
          echo "Bundle identifier:"
          /usr/libexec/PlistBuddy \
            -c "Print :CFBundleIdentifier" \
            "$INFO_PLIST" || true

          echo "INFO_PLIST=$INFO_PLIST" >> "$GITHUB_ENV"

      # ============================================================
      # 13. LIMPAR BUILD ANTERIOR
      # ============================================================
      - name: Clean project
        shell: bash
        run: |
          set -e

          cd "$PROJECT_DIR"

          make clean \
            SDKVERSION="$SDK_VERSION" \
            THEOS="$THEOS"

      # ============================================================
      # 14. COMPILAR
      # ============================================================
      - name: Build project
        shell: bash
        run: |
          set -e

          cd "$PROJECT_DIR"

          make all \
            SDKVERSION="$SDK_VERSION" \
            THEOS="$THEOS" \
            FINALPACKAGE=1 \
            messages=yes

      # ============================================================
      # 15. LOCALIZAR APP COMPILADO
      # ============================================================
      - name: Locate compiled app
        shell: bash
        run: |
          set -e

          echo "Procurando .app compilado..."

          APP=$(find "$PROJECT_DIR/.theos/obj" \
            -type d \
            -name "*.app" \
            -print \
            | head -n 1)

          if [ -z "$APP" ]; then
            echo "::error::Nenhum .app compilado foi encontrado."
            echo
            echo "Conteúdo de .theos:"
            find "$PROJECT_DIR/.theos" -maxdepth 6 -print || true
            exit 1
          fi

          echo "APP encontrado:"
          echo "$APP"

          echo "APP_PATH=$APP" >> "$GITHUB_ENV"

      # ============================================================
      # 16. IDENTIFICAR NOME DO APP
      # ============================================================
      - name: Identify application
        shell: bash
        run: |
          set -e

          APP_NAME=$(basename "$APP_PATH")

          if [ -z "$APP_NAME" ]; then
            echo "::error::Não foi possível identificar o nome do APP."
            exit 1
          fi

          echo "APP_NAME=$APP_NAME" >> "$GITHUB_ENV"

          echo "Aplicativo:"
          echo "$APP_NAME"

      # ============================================================
      # 17. CRIAR ESTRUTURA TROLLSTORE
      # ============================================================
      - name: Prepare TrollStore package
        shell: bash
        run: |
          set -e

          rm -rf "$GITHUB_WORKSPACE/trollstore-stage"
          rm -rf "$GITHUB_WORKSPACE/trollstore-out"

          mkdir -p \
            "$GITHUB_WORKSPACE/trollstore-stage/Payload" \
            "$GITHUB_WORKSPACE/trollstore-out"

          cp -R \
            "$APP_PATH" \
            "$GITHUB_WORKSPACE/trollstore-stage/Payload/$APP_NAME"

      # ============================================================
      # 18. GARANTIR INFOPLIST DENTRO DO APP
      # ============================================================
      - name: Repair final Info.plist
        shell: bash
        run: |
          set -e

          FINAL_APP="$GITHUB_WORKSPACE/trollstore-stage/Payload/$APP_NAME"
          FINAL_INFO="$FINAL_APP/Info.plist"

          if [ ! -f "$FINAL_INFO" ]; then
            echo "Info.plist não está dentro do APP compilado."

            SOURCE_INFO="$INFO_PLIST"

            if [ ! -f "$SOURCE_INFO" ]; then
              echo "::error::Info.plist de origem também não encontrado."
              exit 1
            fi

            cp "$SOURCE_INFO" "$FINAL_INFO"
          fi

          if [ ! -f "$FINAL_INFO" ]; then
            echo "::error::Não foi possível criar Info.plist final."
            exit 1
          fi

          plutil -lint "$FINAL_INFO"

          echo
          echo "Info.plist final:"
          ls -lh "$FINAL_INFO"

      # ============================================================
      # 19. VALIDAR EXECUTÁVEL
      # ============================================================
      - name: Validate application executable
        shell: bash
        run: |
          set -e

          FINAL_APP="$GITHUB_WORKSPACE/trollstore-stage/Payload/$APP_NAME"

          EXECUTABLE=$(
            /usr/libexec/PlistBuddy \
              -c "Print :CFBundleExecutable" \
              "$FINAL_APP/Info.plist"
          )

          if [ -z "$EXECUTABLE" ]; then
            echo "::error::CFBundleExecutable não encontrado."
            exit 1
          fi

          echo "Executável declarado:"
          echo "$EXECUTABLE"

          if [ ! -f "$FINAL_APP/$EXECUTABLE" ]; then
            echo "::error::Executável não encontrado dentro do APP:"
            echo "$FINAL_APP/$EXECUTABLE"
            exit 1
          fi

          echo
          echo "Executável encontrado:"
          ls -lh "$FINAL_APP/$EXECUTABLE"

      # ============================================================
      # 20. VALIDAR BUNDLE
      # ============================================================
      - name: Validate final bundle
        shell: bash
        run: |
          set -e

          FINAL_APP="$GITHUB_WORKSPACE/trollstore-stage/Payload/$APP_NAME"

          echo "Bundle final:"
          find "$FINAL_APP" -maxdepth 3 -print

          test -f "$FINAL_APP/Info.plist"

          APP_COUNT=$(
            find "$GITHUB_WORKSPACE/trollstore-stage/Payload" \
              -maxdepth 1 \
              -type d \
              -name "*.app" \
              | wc -l \
              | tr -d ' '
          )

          if [ "$APP_COUNT" -ne 1 ]; then
            echo "::error::Payload deve conter exatamente um .app."
            exit 1
          fi

          echo "Bundle validado."

      # ============================================================
      # 21. CRIAR TIPA TROLLSTORE
      # ============================================================
      - name: Create TrollStore TIPA
        shell: bash
        run: |
          set -e

          cd "$GITHUB_WORKSPACE/trollstore-stage"

          OUTPUT="$GITHUB_WORKSPACE/trollstore-out/${APP_NAME%.app}-TrollStore.tipa"

          rm -f "$OUTPUT"

          zip -qry \
            "$OUTPUT" \
            Payload

          echo
          echo "TIPA criada:"
          ls -lh "$OUTPUT"

          echo "TIPA_PATH=$OUTPUT" >> "$GITHUB_ENV"

      # ============================================================
      # 22. VERIFICAR TIPA
      # ============================================================
      - name: Verify TIPA
        shell: bash
        run: |
          set -e

          TEST_DIR="$GITHUB_WORKSPACE/tipa-test"

          rm -rf "$TEST_DIR"

          mkdir -p "$TEST_DIR"

          unzip -q \
            "$TIPA_PATH" \
            -d "$TEST_DIR"

          echo "Conteúdo da TIPA:"
          find "$TEST_DIR" -maxdepth 4 -print

          if [ ! -d "$TEST_DIR/Payload" ]; then
            echo "::error::Payload não encontrado na TIPA."
            exit 1
          fi

          APP_COUNT=$(
            find "$TEST_DIR/Payload" \
              -maxdepth 1 \
              -type d \
              -name "*.app" \
              | wc -l \
              | tr -d ' '
          )

          if [ "$APP_COUNT" -ne 1 ]; then
            echo "::error::A TIPA não contém exatamente um .app."
            exit 1
          fi

          FINAL_APP=$(find "$TEST_DIR/Payload" \
            -maxdepth 1 \
            -type d \
            -name "*.app" \
            -print \
            -quit)

          if [ ! -f "$FINAL_APP/Info.plist" ]; then
            echo "::error::Info.plist ausente dentro do APP da TIPA."
            exit 1
          fi

          plutil -lint "$FINAL_APP/Info.plist"

          EXECUTABLE=$(
            /usr/libexec/PlistBuddy \
              -c "Print :CFBundleExecutable" \
              "$FINAL_APP/Info.plist"
          )

          if [ ! -f "$FINAL_APP/$EXECUTABLE" ]; then
            echo "::error::Executável declarado não existe."
            exit 1
          fi

          echo
          echo "======================================"
          echo " TIPA VALIDADA COM SUCESSO"
          echo "======================================"
          echo
          echo "APP:"
          echo "$FINAL_APP"
          echo
          echo "Info.plist:"
          echo "$FINAL_APP/Info.plist"
          echo
          echo "Executável:"
          echo "$FINAL_APP/$EXECUTABLE"

      # ============================================================
      # 23. PUBLICAR ARTIFATO
      # ============================================================
      - name: Upload TrollStore TIPA
        uses: actions/upload-artifact@v4
        with:
          name: TrollStore-TIPA-VERIFIED
          path: |
            ${{ env.TIPA_PATH }}
          if-no-files-found: error
          retention-days: 7

      # ============================================================
      # 24. PUBLICAR LOGS DO BUILD
      # ============================================================
      - name: Upload build logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Build-Logs
          path: |
            ${{ env.PROJECT_DIR }}/.theos
          if-no-files-found: ignore
          retention-days: 3
