name: Build External ESP iOS

on:
  workflow_dispatch:

permissions:
  contents: read

env:
  THEOS: ${{ github.workspace }}/theos
  SOURCE_ZIP: LGL-Inspired-Ultimate-Standoff2-Players-v3-buildfixed.zip

  # ============================================================
  # CONFIGURAÇÃO DO PROJETO
  # ============================================================
  # O projeto original utiliza iPhoneOS16.5.sdk.
  # Deployment mínimo permanece em iOS 15.0.
  # ============================================================
  SDK_VERSION: "16.5"
  MIN_IOS: "15.0"

jobs:

  build:
    name: Build External ESP iOS
    runs-on: macos-15

    steps:

      # ==========================================================
      # CHECKOUT
      # ==========================================================
      - name: Checkout repository
        uses: actions/checkout@v5


      # ==========================================================
      # LOCALIZAR E EXTRAIR ZIP
      # ==========================================================
      - name: Locate and extract ZIP
        shell: bash
        run: |
          set -Eeuo pipefail

          echo "=============================================="
          echo " LOCALIZANDO PROJETO"
          echo "=============================================="

          ZIP_PATH=""

          if [ -f "$GITHUB_WORKSPACE/$SOURCE_ZIP" ]; then
            ZIP_PATH="$GITHUB_WORKSPACE/$SOURCE_ZIP"
          else
            ZIP_PATH="$(
              find "$GITHUB_WORKSPACE" \
                -type f \
                -name "$SOURCE_ZIP" \
                -print \
                -quit
            )"
          fi

          if [ -z "$ZIP_PATH" ]; then
            echo "::error::ZIP não encontrado: $SOURCE_ZIP"

            echo ""
            echo "ZIPs encontrados:"
            find "$GITHUB_WORKSPACE" \
              -type f \
              -iname "*.zip" \
              -print \
              | sort

            exit 1
          fi

          echo "ZIP encontrado:"
          echo "$ZIP_PATH"

          rm -rf "$GITHUB_WORKSPACE/source"

          mkdir -p "$GITHUB_WORKSPACE/source"

          unzip -q \
            "$ZIP_PATH" \
            -d "$GITHUB_WORKSPACE/source"

          echo ""
          echo "Procurando Makefile..."

          PROJECT_MAKEFILE="$(
            find "$GITHUB_WORKSPACE/source" \
              -type f \
              \( -iname "Makefile" -o -iname "makefile" \) \
              -print \
              -quit
          )"

          if [ -z "$PROJECT_MAKEFILE" ]; then
            echo "::error::Nenhum Makefile encontrado."
            exit 1
          fi

          PROJECT_DIR="$(dirname "$PROJECT_MAKEFILE")"

          echo ""
          echo "Makefile:"
          echo "$PROJECT_MAKEFILE"

          echo ""
          echo "Diretório:"
          echo "$PROJECT_DIR"

          echo "APP_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"


      # ==========================================================
      # XCODE
      # ==========================================================
      - name: Configure Xcode
        shell: bash
        run: |
          set -Eeuo pipefail

          echo "=============================================="
          echo " XCODE"
          echo "=============================================="

          echo ""
          xcode-select -p

          echo ""
          xcodebuild -version

          echo ""
          echo "SDKs disponíveis:"
          xcodebuild -showsdks


      # ==========================================================
      # DEPENDÊNCIAS
      # ==========================================================
      - name: Install dependencies
        shell: bash
        run: |
          set -Eeuo pipefail

          echo "=============================================="
          echo " DEPENDÊNCIAS"
          echo "=============================================="

          if ! command -v ldid >/dev/null 2>&1; then
            brew install ldid
          fi

          echo ""
          echo "ldid:"
          command -v ldid

          echo ""
          ldid -V || true


      # ==========================================================
      # THEOS
      # ==========================================================
      - name: Install Theos
        shell: bash
        run: |
          set -Eeuo pipefail

          echo "=============================================="
          echo " THEOS"
          echo "=============================================="

          rm -rf "$THEOS"

          git clone \
            --recursive \
            --depth 1 \
            https://github.com/theos/theos.git \
            "$THEOS"

          git -C "$THEOS" \
            submodule update \
            --init \
            --recursive

          if [ ! -f "$THEOS/makefiles/common.mk" ]; then
            echo "::error::Theos não foi instalado corretamente."
            exit 1
          fi

          echo "$THEOS/bin" >> "$GITHUB_PATH"

          echo ""
          echo "Theos:"
          echo "$THEOS"

          echo ""
          echo "Commit:"
          git -C "$THEOS" rev-parse --short HEAD


      # ==========================================================
      # INSTALAR SDK EXIGIDO PELO PROJETO
      # ==========================================================
      - name: Install project SDK
        shell: bash
        run: |
          set -Eeuo pipefail

          echo "=============================================="
          echo " SDK DO PROJETO"
          echo "=============================================="

          echo ""
          echo "SDK solicitado: iPhoneOS${SDK_VERSION}.sdk"
          echo "iOS mínimo: ${MIN_IOS}"

          SDK_REPO="$GITHUB_WORKSPACE/theos-sdks"

          rm -rf "$SDK_REPO"

          git clone \
            --depth 1 \
            https://github.com/theos/sdks.git \
            "$SDK_REPO"

          SDK_SOURCE="$SDK_REPO/iPhoneOS${SDK_VERSION}.sdk"
          SDK_DEST="$THEOS/sdks/iPhoneOS${SDK_VERSION}.sdk"

          if [ ! -d "$SDK_SOURCE" ]; then
            echo "::error::O SDK exigido pelo projeto não foi encontrado:"
            echo "$SDK_SOURCE"

            echo ""
            echo "SDKs disponíveis:"
            find "$SDK_REPO" \
              -maxdepth 1 \
              -type d \
              -name "iPhoneOS*.sdk" \
              -print \
              | sort

            exit 1
          fi

          mkdir -p "$THEOS/sdks"

          rm -rf "$SDK_DEST"

          cp -R \
            "$SDK_SOURCE" \
            "$THEOS/sdks/"

          if [ ! -d "$SDK_DEST" ]; then
            echo "::error::Falha ao instalar SDK."
            exit 1
          fi

          echo ""
          echo "SDK instalado com sucesso:"
          ls -ld "$SDK_DEST"


      # ==========================================================
      # VALIDAR THEOS + SDK
      # ==========================================================
      - name: Validate Theos and SDK
        shell: bash
        run: |
          set -Eeuo pipefail

          echo "=============================================="
          echo " VALIDAÇÃO"
          echo "=============================================="

          test -f "$THEOS/makefiles/common.mk"
          test -f "$THEOS/makefiles/application.mk"
          test -d "$THEOS/sdks/iPhoneOS${SDK_VERSION}.sdk"

          echo ""
          echo "Theos:"
          echo "$THEOS"

          echo ""
          echo "SDK:"
          ls -ld "$THEOS/sdks/iPhoneOS${SDK_VERSION}.sdk"


      # ==========================================================
      # VALIDAR CONFIGURAÇÃO REAL DO PROJETO
      # ==========================================================
      - name: Validate project configuration
        working-directory: ${{ env.APP_DIR }}
        shell: bash
        run: |
          set -Eeuo pipefail

          echo "=============================================="
          echo " CONFIGURAÇÃO DO PROJETO"
          echo "=============================================="

          echo ""
          echo "Diretório:"
          pwd

          echo ""
          echo "TARGET encontrado no Makefile:"

          grep -nE \
            '^[[:space:]]*TARGET[[:space:]]*[:?+]?=' \
            Makefile \
            || true

          echo ""
          echo "SDKVERSION encontrado:"

          grep -nE \
            '^[[:space:]]*SDKVERSION[[:space:]]*[:?+]?=' \
            Makefile \
            || true

          echo ""
          echo "=============================================="
          echo " MAKEFILE ORIGINAL"
          echo "=============================================="

          cat Makefile

          echo ""
          echo "=============================================="
          echo " CONFERÊNCIA"
          echo "=============================================="

          if grep -Eq \
            'SDKVERSION[[:space:]]*[:?+]?=[[:space:]]*16\.5' \
            Makefile; then

            echo "OK: projeto utiliza SDK 16.5."

          else
            echo "::warning::O Makefile não declara explicitamente SDKVERSION=16.5."
            echo "O build utilizará SDKVERSION=$SDK_VERSION."
          fi

          echo ""
          echo "O deployment target do projeto será preservado."
          echo "O workflow não sobrescreve TARGET."


      # ==========================================================
      # COMPILAR
      # ==========================================================
      - name: Build project
        working-directory: ${{ env.APP_DIR }}
        shell: bash
        run: |
          set -Eeuo pipefail

          echo "=============================================="
          echo " BUILD"
          echo "=============================================="

          echo ""
          echo "Projeto:"
          pwd

          echo ""
          echo "Theos:"
          echo "$THEOS"

          echo ""
          echo "SDK:"
          echo "$SDK_VERSION"

          echo ""
          echo "iOS mínimo configurado pelo workflow:"
          echo "$MIN_IOS"

          echo ""
          echo "Limpando build anterior..."

          make clean \
            SDKVERSION="$SDK_VERSION" \
            || true

          echo ""
          echo "Compilando e empacotando..."

          make package \
            SDKVERSION="$SDK_VERSION" \
            FINALPACKAGE=1 \
            DEBUG=0 \
            messages=yes \
            2>&1 | tee "$GITHUB_WORKSPACE/build.log"

          echo ""
          echo "=============================================="
          echo " BUILD FINALIZADO"
          echo "=============================================="


      # ==========================================================
      # LOCALIZAR TIPA
      # ==========================================================
      - name: Locate TIPA
        working-directory: ${{ env.APP_DIR }}
        shell: bash
        run: |
          set -Eeuo pipefail

          echo "=============================================="
          echo " PROCURANDO TIPA"
          echo "=============================================="

          TIPA="$(
            find "$PWD/packages" \
              -maxdepth 1 \
              -type f \
              -name "*.tipa" \
              -print \
              -quit
          )"

          if [ -z "$TIPA" ]; then
            echo "::error::Nenhum .tipa foi gerado."

            echo ""
            echo "Conteúdo de packages:"
            find "$PWD/packages" \
              -maxdepth 2 \
              -print \
              | sort \
              || true

            exit 1
          fi

          TIPA_NAME="$(basename "$TIPA")"

          echo ""
          echo "TIPA encontrado:"
          echo "$TIPA"

          echo ""
          echo "Nome:"
          echo "$TIPA_NAME"

          echo "TIPA_PATH=$TIPA" >> "$GITHUB_ENV"
          echo "TIPA_NAME=$TIPA_NAME" >> "$GITHUB_ENV"


      # ==========================================================
      # CRIAR IPA
      # ==========================================================
      - name: Create IPA
        shell: bash
        run: |
          set -Eeuo pipefail

          echo "=============================================="
          echo " CRIANDO IPA"
          echo "=============================================="

          rm -rf \
            "$GITHUB_WORKSPACE/ipa_extract" \
            "$GITHUB_WORKSPACE/output"

          mkdir -p \
            "$GITHUB_WORKSPACE/ipa_extract" \
            "$GITHUB_WORKSPACE/output"

          unzip -q \
            "$TIPA_PATH" \
            -d "$GITHUB_WORKSPACE/ipa_extract"

          if [ ! -d "$GITHUB_WORKSPACE/ipa_extract/Payload" ]; then
            echo "::error::TIPA não contém Payload."
            exit 1
          fi

          APP="$(
            find "$GITHUB_WORKSPACE/ipa_extract/Payload" \
              -maxdepth 1 \
              -type d \
              -name "*.app" \
              -print \
              -quit
          )"

          if [ -z "$APP" ]; then
            echo "::error::Nenhum .app encontrado."
            exit 1
          fi

          APP_NAME="$(basename "$APP" .app)"

          mkdir -p \
            "$GITHUB_WORKSPACE/output/Payload"

          cp -R \
            "$APP" \
            "$GITHUB_WORKSPACE/output/Payload/$APP_NAME.app"

          cd "$GITHUB_WORKSPACE/output"

          /usr/bin/ditto \
            -c \
            -k \
            --sequesterRsrc \
            --keepParent \
            Payload \
            "$APP_NAME.ipa"

          if [ ! -s "$APP_NAME.ipa" ]; then
            echo "::error::IPA não foi criada."
            exit 1
          fi

          echo ""
          echo "IPA criada:"
          ls -lh "$APP_NAME.ipa"

          echo ""
          echo "SHA256:"
          shasum -a 256 "$APP_NAME.ipa"

          echo ""
          echo "Copiando TIPA..."

          cp \
            "$TIPA_PATH" \
            "$GITHUB_WORKSPACE/output/$TIPA_NAME"

          echo ""
          echo "Arquivos finais:"
          ls -lh "$GITHUB_WORKSPACE/output"


      # ==========================================================
      # UPLOAD IPA + TIPA
      # ==========================================================
      - name: Upload IPA and TIPA
        uses: actions/upload-artifact@v4
        with:
          name: External-ESP-iOS-Build
          path: |
            output/*.ipa
            output/*.tipa
          if-no-files-found: error
          retention-days: 14


      # ==========================================================
      # UPLOAD LOGS
      # ==========================================================
      - name: Upload build log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: External-ESP-build-log
          path: |
            build.log
            source/**/.theos/log/**
            source/**/.theos/obj/**
          if-no-files-found: ignore
          retention-days: 7

O ponto principal: agora o workflow instala "iPhoneOS16.5.sdk" e força apenas "SDKVERSION=16.5". O "TARGET" original não é artificialmente alterado, então o projeto mantém sua configuração própria. Isso é mais correto do que transformar tudo em "15.6:15.0".

Se o Makefile original for, por exemplo, "TARGET = iphone:clang:16.5:14.0", ele continuará usando 16.5/14.0, enquanto o SDK necessário estará disponível.
