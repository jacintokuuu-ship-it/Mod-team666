name: UE4 Analysis

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  analyze:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Verificar libUE4.so
        shell: bash
        run: |
          set -euo pipefail

          test -f libUE4.so || {
            echo "::error::libUE4.so não encontrado na raiz do repositório."
            exit 1
          }

          echo "Arquivo:"
          ls -lh libUE4.so

          echo
          echo "Formato ELF:"
          file libUE4.so

          echo
          echo "Arquitetura:"
          readelf -h libUE4.so | grep -E 'Class|Machine|Type'

      - name: Criar diretório de análise
        run: |
          mkdir -p output

      - name: Informações da lib
        shell: bash
        run: |
          set -euo pipefail

          readelf -h libUE4.so > output/elf-header.txt
          readelf -S libUE4.so > output/sections.txt
          readelf -d libUE4.so > output/dynamic.txt
          strings -n 6 libUE4.so > output/strings.txt

      - name: Publicar análise
        uses: actions/upload-artifact@v4
        with:
          name: ue4-analysis
          path: output/
          if-no-files-found: error
