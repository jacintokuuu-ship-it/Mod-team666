name: Build Theos iOS

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Procurar theos-2.5.zip
        shell: bash
        run: |
          set -e

          ZIP="$(find "$GITHUB_WORKSPACE" \
            -type f \
            -iname 'theos-2.5.zip' \
            -print -quit)"

          if [ -z "$ZIP" ]; then
            echo "ERRO: theos-2.5.zip não encontrado."
            echo
            echo "Arquivos encontrados:"
            find "$GITHUB_WORKSPACE" -maxdepth 5 -type f -print | sort
            exit 1
          fi

          echo "Arquivo encontrado:"
          echo "$ZIP"

          echo "THEOS_ZIP=$ZIP" >> "$GITHUB_ENV"

      - name: Extrair Theos
        shell: bash
        run: |
          set -e

          rm -rf "$RUNNER_TEMP/theos"
          mkdir -p "$RUNNER_TEMP/theos"

          unzip -oq "$THEOS_ZIP" -d "$RUNNER_TEMP/theos"

          echo "Theos extraído:"
          find "$RUNNER_TEMP/theos" -maxdepth 3 -type f -print | sort | head -200

      - name: Localizar diretório Theos
        shell: bash
        run: |
          set -e

          THEOS_DIR=""

          while IFS= read -r dir; do
            if [ -f "$dir/bin/nic.pl" ] &&
               [ -d "$dir/makefiles" ]; then
              THEOS_DIR="$dir"
              break
            fi
          done < <(find "$RUNNER_TEMP/theos" -type d -print)

          if [ -z "$THEOS_DIR" ]; then
            echo "ERRO: diretório Theos não encontrado."
            exit 1
          fi

          echo "Theos:"
          echo "$THEOS_DIR"

          echo "THEOS=$THEOS_DIR" >> "$GITHUB_ENV"

      - name: Procurar projeto
        shell: bash
        run: |
          set -e

          PROJECT_DIR=""

          while IFS= read -r makefile; do
            DIR="$(dirname "$makefile")"

            case "$DIR" in
              "$THEOS"/*)
                continue
                ;;
            esac

            PROJECT_DIR="$DIR"
            break
          done < <(find "$GITHUB_WORKSPACE" -type f -name Makefile -print)

          if [ -z "$PROJECT_DIR" ]; then
            echo "ERRO: nenhum projeto Theos encontrado."
            echo
            echo "Makefiles encontrados:"
            find "$GITHUB_WORKSPACE" -type f -name Makefile -print
            exit 1
          fi

          echo "Projeto:"
          echo "$PROJECT_DIR"

          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"

      - name: Compilar
        shell: bash
        run: |
          set -e

          export THEOS="$THEOS"

          cd "$PROJECT_DIR"

          echo "Diretório:"
          pwd

          echo "Makefile:"
          cat Makefile

          make clean || true
          make package FINALPACKAGE=1

      - name: Publicar resultado
        uses: actions/upload-artifact@v4
        with:
          name: ios-build
          path: |
            ${{ env.PROJECT_DIR }}/packages/*
          if-no-files-found: error
