name: UE4 Static Analysis

on:
  workflow_dispatch:

permissions:
  contents: read

env:
  LIB_URL: "https://www.mediafire.com/file/cuk8zo97aiiddxv/libUE4.so/file?dkey=igxg46m4yif&r=1253"
  LIB_NAME: "libUE4.so"
  GHIDRA_VERSION: "12.1.4"

jobs:
  analyze:
    runs-on: ubuntu-24.04

    steps:
      - name: Download library
        shell: bash
        run: |
          set -euo pipefail

          mkdir -p input output ghidra-project

          curl -fL \
            --retry 5 \
            --retry-all-errors \
            "$LIB_URL" \
            -o "input/$LIB_NAME"

          test -s "input/$LIB_NAME"

          file "input/$LIB_NAME"

      - name: Install Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Download Ghidra
        shell: bash
        run: |
          set -euo pipefail

          curl -fL \
            --retry 5 \
            --retry-all-errors \
            "https://github.com/NationalSecurityAgency/ghidra/releases/download/Ghidra_${GHIDRA_VERSION}_build/ghidra_${GHIDRA_VERSION}_PUBLIC.zip" \
            -o ghidra.zip

          unzip -q ghidra.zip
          mv "ghidra_${GHIDRA_VERSION}_PUBLIC" ghidra

          test -x ghidra/support/analyzeHeadless

      - name: Ghidra headless analysis
        shell: bash
        run: |
          set -euo pipefail

          ./ghidra/support/analyzeHeadless \
            ghidra-project \
            UE4Analysis \
            -import "input/$LIB_NAME" \
            -processor "AARCH64:LE:64:v8A" \
            -analysisTimeoutPerFile 1800 \
            -max-cpu 4 \
            -overwrite \
            -log "output/ghidra.log"

      - name: Export basic binary information
        shell: bash
        run: |
          set -euo pipefail

          file input/libUE4.so > output/file.txt

          readelf -h input/libUE4.so \
            > output/elf-header.txt

          readelf -S input/libUE4.so \
            > output/sections.txt

          readelf -Ws input/libUE4.so \
            > output/symbols.txt || true

          readelf -d input/libUE4.so \
            > output/dynamic.txt

          strings -a -n 5 input/libUE4.so \
            > output/strings.txt

      - name: Package
        shell: bash
        run: |
          tar -czf UE4-analysis.tar.gz \
            output \
            ghidra-project

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: UE4-Ghidra-Analysis
          path: UE4-analysis.tar.gz
          if-no-files-found: error
