name: Build External ESP iOS

on:
  workflow_dispatch:

permissions:
  contents: read

env:
  THEOS: ${{ github.workspace }}/theos
  SOURCE_ZIP: External_ESP_Free_Fire-main.zip

jobs:

  build:
    name: Build External ESP iOS
    runs-on: macos-15

    steps:

      # ==========================================================
      # CHECKOUT
      # ==========================================================
      - name: Checkout repository
        uses: actions/checkout@v5


      # ==========================================================
      # LOCALIZAR E EXTRAIR PROJETO
      # ==========================================================
      - name: Locate and extract project
        shell: bash
        run: |
          set -Eeuo pipefail

          echo "=============================================="
          echo " LOCALIZANDO PROJETO"
          echo "=============================================="

          ZIP_PATH="$GITHUB_WORKSPACE/$SOURCE_ZIP"

          if [ ! -f "$ZIP_PATH" ]; then
            echo "::error::ZIP não encontrado:"
            echo "$ZIP_PATH"

            echo ""
            echo "ZIPs disponíveis:"
            find "$GITHUB_WORKSPACE" \
              -type f \
              -iname "*.zip" \
              -print \
              | sort

            exit 1
          fi

          echo "ZIP:"
          echo "$ZIP_PATH"

          rm -rf "$GITHUB_WORKSPACE/source"

          mkdir -p "$GITHUB_WORKSPACE/source"

          unzip -q \
            "$ZIP_PATH" \
            -d "$GITHUB_WORKSPACE/source"

          echo ""
          echo "Procurando makefile..."

          PROJECT_MAKEFILE="$(
            find "$GITHUB_WORKSPACE/source" \
              -type f \
              \( -iname "Makefile" -o -iname "makefile" \) \
              -print \
              -quit
          )"

          if [ -z "$PROJECT_MAKEFILE" ]; then
            echo "::error::Nenhum Makefile/makefile encontrado."
            exit 1
          fi

          PROJECT_DIR="$(dirname "$PROJECT_MAKEFILE")"

          echo ""
          echo "Makefile:"
          echo "$PROJECT_MAKEFILE"

          echo ""
          echo "Projeto:"
          echo "$PROJECT_DIR"

          echo "APP_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"


      # ==========================================================
      # LER TARGET REAL DO PROJETO
      # ==========================================================
      - name: Read project build configuration
        working-directory: ${{ env.APP_DIR }}
        shell: bash
        run: |
          set -Eeuo pipefail

          echo "=============================================="
          echo " CONFIGURAÇÃO REAL DO PROJETO"
          echo "=============================================="

          TARGET_LINE="$(
            grep -E \
              '^[[:space:]]*TARGET[[:space:]]*:?[?+]?=' \
              makefile \
              | head -n 1 \
              || true
          )"

          if [ -z "$TARGET_LINE" ]; then
            echo "::error::TARGET não encontrado no makefile."
            exit 1
          fi

          TARGET_VALUE="$(
            echo "$TARGET_LINE" \
              | sed -E 's/^[[:space:]]*TARGET[[:space:]]*:?[?+]?=[[:space:]]*//'
          )

          echo "TARGET:"
          echo "$TARGET_VALUE"

          SDK_VERSION="$(
            echo "$TARGET_VALUE" \
              | awk -F: '{print $3}'
          )

          DEPLOYMENT_VERSION="$(
            echo "$TARGET_VALUE" \
              | awk -F: '{print $4}'
          )

          PLATFORM="$(
            echo "$TARGET_VALUE" \
              | awk -F: '{print $1}'
          )

          COMPILER="$(
            echo "$TARGET_VALUE" \
              | awk -F: '{print $2}'
          )

          if [ -z "$SDK_VERSION" ]; then
            echo "::error::Não foi possível determinar SDK_VERSION."
            exit 1
          fi

          if [ -z "$DEPLOYMENT_VERSION" ]; then
            echo "::error::Não foi possível determinar deployment target."
            exit 1
          fi

          echo ""
          echo "Platform:     $PLATFORM"
          echo "Compiler:     $COMPILER"
          echo "SDK:          $SDK_VERSION"
          echo "Deployment:   $DEPLOYMENT_VERSION"

          echo "TARGET_VALUE=$TARGET_VALUE" >> "$GITHUB_ENV"
          echo "SDK_VERSION=$SDK_VERSION" >> "$GITHUB_ENV"
          echo "MIN_IOS=$DEPLOYMENT_VERSION" >> "$GITHUB_ENV"

          echo ""
          echo "=============================================="
          echo " MAKEFILE"
          echo "=============================================="

          cat makefile


      # ==========================================================
      # VALIDAR ESTRUTURA DO PROJETO
      # ==========================================================
      - name: Validate project structure
        working-directory: ${{ env.APP_DIR }}
        shell: bash
        run: |
          set -Eeuo pipefail

          echo "=============================================="
          echo " VALIDANDO PROJETO"
          echo "=============================================="

          REQUIRED_FILES=(
            "makefile"
            "layout/entitlements.plist"
            "layout/Resources/Info.plist"
          )

          for FILE in "${REQUIRED_FILES[@]}"; do
            if [ ! -e "$FILE" ]; then
              echo "::error::Arquivo obrigatório não encontrado: $FILE"
              exit 1
            fi
          done

          REQUIRED_DIRS=(
            "sources"
            "headers"
            "esp"
            "layout"
          )

          for DIR in "${REQUIRED_DIRS[@]}"; do
            if [ ! -d "$DIR" ]; then
              echo "::error::Diretório obrigatório não encontrado: $DIR"
              exit 1
            fi
          done

          echo "Estrutura do projeto OK."


      # ==========================================================
      # XCODE
      # ==========================================================
      - name: Configure Xcode
        shell: bash
        run: |
          set -Eeuo pipefail

          echo "=============================================="
          echo " XCODE"
          echo "=============================================="

          echo ""
          xcode-select -p

          echo ""
          xcodebuild -version

          echo ""
          echo "SDKs do Xcode:"
          xcodebuild -showsdks


      # ==========================================================
      # DEPENDÊNCIAS
      # ==========================================================
      - name: Install dependencies
        shell: bash
        run: |
          set -Eeuo pipefail

          echo "=============================================="
          echo " DEPENDÊNCIAS"
          echo "=============================================="

          if ! command -v ldid >/dev/null 2>&1; then
            brew install ldid
          fi

          echo ""
          echo "ldid:"
          command -v ldid

          ldid -V || true


      # ==========================================================
      # THEOS
      # ==========================================================
      - name: Install Theos
        shell: bash
        run: |
          set -Eeuo pipefail

          echo "=============================================="
          echo " THEOS"
          echo "=============================================="

          rm -rf "$THEOS"

          git clone \
            --recursive \
            --depth 1 \
            https://github.com/theos/theos.git \
            "$THEOS"

          git -C "$THEOS" \
            submodule update \
            --init \
            --recursive

          if [ ! -f "$THEOS/makefiles/common.mk" ]; then
            echo "::error::Theos não foi instalado corretamente."
            exit 1
          fi

          echo "$THEOS/bin" >> "$GITHUB_PATH"

          echo ""
          echo "THEOS:"
          echo "$THEOS"

          echo ""
          echo "Commit:"
          git -C "$THEOS" rev-parse --short HEAD


      # ==========================================================
      # INSTALAR SDK EXATO DO TARGET
      # ==========================================================
      - name: Install project SDK
        shell: bash
        run: |
          set -Eeuo pipefail

          echo "=============================================="
          echo " INSTALANDO SDK"
          echo "=============================================="

          echo "SDK solicitado:"
          echo "iPhoneOS${SDK_VERSION}.sdk"

          echo ""
          echo "Deployment target:"
          echo "iOS ${MIN_IOS}"

          SDK_REPO="$GITHUB_WORKSPACE/theos-sdks"

          rm -rf "$SDK_REPO"

          git clone \
            --depth 1 \
            https://github.com/theos/sdks.git \
            "$SDK_REPO"

          SDK_SOURCE="$SDK_REPO/iPhoneOS${SDK_VERSION}.sdk"
          SDK_DEST="$THEOS/sdks/iPhoneOS${SDK_VERSION}.sdk"

          if [ ! -d "$SDK_SOURCE" ]; then
            echo "::error::SDK exigido pelo projeto não encontrado:"
            echo "$SDK_SOURCE"

            echo ""
            echo "SDKs disponíveis:"
            find "$SDK_REPO" \
              -maxdepth 1 \
              -type d \
              -name "iPhoneOS*.sdk" \
              -print \
              | sort

            exit 1
          fi

          mkdir -p "$THEOS/sdks"

          rm -rf "$SDK_DEST"

          cp -R \
            "$SDK_SOURCE" \
            "$THEOS/sdks/"

          if [ ! -d "$SDK_DEST" ]; then
            echo "::error::Falha ao instalar SDK."
            exit 1
          fi

          echo ""
          echo "SDK instalado:"
          ls -ld "$SDK_DEST"


      # ==========================================================
      # VALIDAR THEOS + SDK
      # ==========================================================
      - name: Validate Theos and SDK
        shell: bash
        run: |
          set -Eeuo pipefail

          echo "=============================================="
          echo " VALIDAÇÃO THEOS + SDK"
          echo "=============================================="

          test -f "$THEOS/makefiles/common.mk"
          test -f "$THEOS/makefiles/application.mk"
          test -d "$THEOS/sdks/iPhoneOS${SDK_VERSION}.sdk"

          echo ""
          echo "Theos OK:"
          echo "$THEOS"

          echo ""
          echo "SDK OK:"
          ls -ld "$THEOS/sdks/iPhoneOS${SDK_VERSION}.sdk"


      # ==========================================================
      # VALIDAR ENTITLEMENTS
      # ==========================================================
      - name: Validate entitlements
        working-directory: ${{ env.APP_DIR }}
        shell: bash
        run: |
          set -Eeuo pipefail

          echo "=============================================="
          echo " VALIDANDO ENTITLEMENTS"
          echo "=============================================="

          /usr/libexec/PlistBuddy \
            -c "Print" \
            layout/entitlements.plist \
            >/dev/null

          echo "entitlements.plist válido."

          echo ""
          echo "CODESIGN FLAGS:"
          grep -n "CODESIGN_FLAGS" makefile || true


      # ==========================================================
      # BUILD
      # ==========================================================
      - name: Build project
        working-directory: ${{ env.APP_DIR }}
        shell: bash
        run: |
          set -Eeuo pipefail

          echo "=============================================="
          echo " BUILD"
          echo "=============================================="

          echo ""
          echo "Projeto:"
          pwd

          echo ""
          echo "TARGET:"
          echo "$TARGET_VALUE"

          echo ""
          echo "SDK:"
          echo "$SDK_VERSION"

          echo ""
          echo "Deployment:"
          echo "$MIN_IOS"

          echo ""
          echo "Limpando build anterior..."

          make clean \
            TARGET="$TARGET_VALUE" \
            SDKVERSION="$SDK_VERSION" \
            || true

          echo ""
          echo "Compilando..."

          make package \
            TARGET="$TARGET_VALUE" \
            SDKVERSION="$SDK_VERSION" \
            FINALPACKAGE=1 \
            DEBUG=0 \
            FOR_RELEASE=1 \
            messages=yes \
            2>&1 | tee "$GITHUB_WORKSPACE/build.log"

          echo ""
          echo "=============================================="
          echo " BUILD CONCLUÍDO"
          echo "=============================================="


      # ==========================================================
      # VALIDAR ARTEFATO GERADO PELO PRÓPRIO MAKEFILE
      # ==========================================================
      - name: Locate TIPA
        working-directory: ${{ env.APP_DIR }}
        shell: bash
        run: |
          set -Eeuo pipefail

          echo "=============================================="
          echo " PROCURANDO TIPA"
          echo "=============================================="

          TIPA="$(
            find "$PWD/packages" \
              -maxdepth 1 \
              -type f \
              -name "*.tipa" \
              -print \
              -quit
          )"

          if [ -z "$TIPA" ]; then
            echo "::error::Nenhum .tipa foi gerado."

            echo ""
            echo "Conteúdo de packages:"
            find "$PWD/packages" \
              -maxdepth 2 \
              -print \
              | sort \
              || true

            exit 1
          fi

          TIPA_NAME="$(basename "$TIPA")"

          echo ""
          echo "TIPA encontrado:"
          echo "$TIPA"

          echo ""
          echo "Nome:"
          echo "$TIPA_NAME"

          echo "TIPA_PATH=$TIPA" >> "$GITHUB_ENV"
          echo "TIPA_NAME=$TIPA_NAME" >> "$GITHUB_ENV"


      # ==========================================================
      # VALIDAR PAYLOAD
      # ==========================================================
      - name: Validate TIPA
        shell: bash
        run: |
          set -Eeuo pipefail

          echo "=============================================="
          echo " VALIDANDO TIPA"
          echo "=============================================="

          rm -rf "$GITHUB_WORKSPACE/tipa_check"

          mkdir -p "$GITHUB_WORKSPACE/tipa_check"

          unzip -q \
            "$TIPA_PATH" \
            -d "$GITHUB_WORKSPACE/tipa_check"

          if [ ! -d "$GITHUB_WORKSPACE/tipa_check/Payload" ]; then
            echo "::error::TIPA não contém Payload."
            exit 1
          fi

          APP="$(
            find "$GITHUB_WORKSPACE/tipa_check/Payload" \
              -maxdepth 1 \
              -type d \
              -name "*.app" \
              -print \
              -quit
          )"

          if [ -z "$APP" ]; then
            echo "::error::Nenhum .app encontrado no Payload."
            exit 1
          fi

          echo ""
          echo "APP:"
          echo "$APP"

          if [ ! -f "$APP/Info.plist" ]; then
            echo "::error::Info.plist não encontrado."
            exit 1
          fi

          if [ ! -x "$APP/TrollSpeed" ]; then
            echo "::error::Executável TrollSpeed não encontrado ou não executável."
            exit 1
          fi

          echo ""
          echo "Payload validado."


      # ==========================================================
      # CRIAR IPA A PARTIR DO TIPA
      # ==========================================================
      - name: Create IPA
        shell: bash
        run: |
          set -Eeuo pipefail

          echo "=============================================="
          echo " CRIANDO IPA"
          echo "=============================================="

          rm -rf \
            "$GITHUB_WORKSPACE/ipa_extract" \
            "$GITHUB_WORKSPACE/output"

          mkdir -p \
            "$GITHUB_WORKSPACE/ipa_extract" \
            "$GITHUB_WORKSPACE/output"

          unzip -q \
            "$TIPA_PATH" \
            -d "$GITHUB_WORKSPACE/ipa_extract"

          if [ ! -d "$GITHUB_WORKSPACE/ipa_extract/Payload" ]; then
            echo "::error::TIPA não contém Payload."
            exit 1
          fi

          APP="$(
            find "$GITHUB_WORKSPACE/ipa_extract/Payload" \
              -maxdepth 1 \
              -type d \
              -name "*.app" \
              -print \
              -quit
          )"

          if [ -z "$APP" ]; then
            echo "::error::Nenhum .app encontrado."
            exit 1
          fi

          APP_NAME="$(basename "$APP" .app)"

          mkdir -p \
            "$GITHUB_WORKSPACE/output/Payload"

          cp -R \
            "$APP" \
            "$GITHUB_WORKSPACE/output/$APP_NAME.app.tmp"

          mv \
            "$GITHUB_WORKSPACE/output/$APP_NAME.app.tmp" \
            "$GITHUB_WORKSPACE/output/Payload/$APP_NAME.app"

          cd "$GITHUB_WORKSPACE/output"

          /usr/bin/ditto \
            -c \
            -k \
            --sequesterRsrc \
            --keepParent \
            Payload \
            "$APP_NAME.ipa"

          if [ ! -s "$APP_NAME.ipa" ]; then
            echo "::error::IPA não foi criada."
            exit 1
          fi

          echo ""
          echo "IPA criada:"
          ls -lh "$APP_NAME.ipa"

          echo ""
          echo "SHA256:"
          shasum -a 256 "$APP_NAME.ipa"

          echo ""
          echo "Copiando TIPA..."

          cp \
            "$TIPA_PATH" \
            "$GITHUB_WORKSPACE/output/$TIPA_NAME"

          echo ""
          echo "Arquivos finais:"
          ls -lh "$GITHUB_WORKSPACE/output"


      # ==========================================================
      # UPLOAD IPA + TIPA
      # ==========================================================
      - name: Upload IPA and TIPA
        uses: actions/upload-artifact@v4
        with:
          name: External-ESP-iOS-Build
          path: |
            output/*.ipa
            output/*.tipa
          if-no-files-found: error
          retention-days: 14


      # ==========================================================
      # UPLOAD LOG
      # ==========================================================
      - name: Upload build log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: External-ESP-build-log
          path: |
            build.log
            source/**/.theos/log/**
            source/**/.theos/obj/**
          if-no-files-found: ignore
          retention-days: 7
