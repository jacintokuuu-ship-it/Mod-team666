name: Build Pro iOS

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-15

    steps:
      - name: Baixar arquivos do repositorio
        uses: actions/checkout@v4

      - name: Procurar Pro.zip
        shell: bash
        run: |
          set -e

          ZIP="$(find . -type f -iname 'Pro.zip' -print -quit)"

          if [ -z "$ZIP" ]; then
            echo "ERRO: Pro.zip nao encontrado."
            echo "Arquivos encontrados:"
            find . -maxdepth 4 -type f -print | sort
            exit 1
          fi

          echo "Pro.zip encontrado em: $ZIP"
          echo "PRO_ZIP=$ZIP" >> "$GITHUB_ENV"

      - name: Extrair Pro.zip
        shell: bash
        run: |
          set -e

          rm -rf "$RUNNER_TEMP/pro"
          mkdir -p "$RUNNER_TEMP/pro"

          unzip -q "$PRO_ZIP" -d "$RUNNER_TEMP/pro"

          echo "Conteudo extraido:"
          find "$RUNNER_TEMP/pro" -maxdepth 5 -print | sort | head -500

      - name: Encontrar projeto Theos
        shell: bash
        run: |
          set -e

          PROJECT=""

          while IFS= read -r file; do
            DIR="$(dirname "$file")"

            if grep -q 'THEOS.*makefiles/common.mk\|makefiles/common.mk' "$file" 2>/dev/null; then
              PROJECT="$DIR"
              break
            fi
          done < <(find "$RUNNER_TEMP/pro" -type f -name Makefile -print)

          if [ -z "$PROJECT" ]; then
            echo "ERRO: nenhum Makefile Theos foi encontrado."
            echo "Makefiles encontrados:"
            find "$RUNNER_TEMP/pro" -type f -name Makefile -print
            exit 1
          fi

          echo "Projeto Theos encontrado em:"
          echo "$PROJECT"

          echo "PROJECT=$PROJECT" >> "$GITHUB_ENV"

      - name: Instalar dependencias do Theos
        shell: bash
        run: |
          set -e

          if [ ! -d "$HOME/theos" ]; then
            git clone --depth 1 https://github.com/theos/theos.git "$HOME/theos"
          fi

          echo "THEOS=$HOME/theos" >> "$GITHUB_ENV"

      - name: Preparar SDK e ferramentas
        shell: bash
        run: |
          set -e

          export THEOS="$HOME/theos"

          echo "Theos:"
          "$THEOS/bin/nic.pl" --version || true

          echo "Xcode:"
          xcodebuild -version

          echo "SDKs:"
          xcrun --sdk iphoneos --show-sdk-path

      - name: Compilar projeto
        shell: bash
        run: |
          set -e

          export THEOS="$HOME/theos"

          cd "$PROJECT"

          echo "Diretorio de build:"
          pwd

          echo "Makefile:"
          sed -n '1,240p' Makefile

          make clean || true
          make package FINALPACKAGE=1

      - name: Procurar resultados
        shell: bash
        run: |
          set -e

          echo "Arquivos gerados:"

          find "$PROJECT" \
            \( -name '*.dylib' -o -name '*.deb' -o -name '*.ipa' \) \
            -type f \
            -print \
            | sort

      - name: Publicar resultado
        uses: actions/upload-artifact@v4
        with:
          name: pro-build
          path: |
            ${{ env.PROJECT }}/packages/*
            ${{ env.PROJECT }}/.theos/obj/**/*.dylib
          if-no-files-found: error
