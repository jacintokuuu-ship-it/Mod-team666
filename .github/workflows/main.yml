name: Build Pro iOS

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-15

    steps:
      - name: Baixar repositorio
        uses: actions/checkout@v4

      - name: Localizar Pro.zip
        shell: bash
        run: |
          set -e

          ZIP="$(find "$GITHUB_WORKSPACE" -type f -iname 'Pro.zip' -print -quit)"

          if [ -z "$ZIP" ]; then
            echo "ERRO: Pro.zip nao encontrado."
            echo "Coloque Pro.zip no repositorio."
            find "$GITHUB_WORKSPACE" -maxdepth 4 -type f -print
            exit 1
          fi

          echo "Pro encontrado:"
          echo "$ZIP"

          echo "PRO_ZIP=$ZIP" >> "$GITHUB_ENV"

      - name: Extrair Pro.zip
        shell: bash
        run: |
          set -e

          rm -rf "$RUNNER_TEMP/Pro"
          mkdir -p "$RUNNER_TEMP/Pro"

          unzip -o "$PRO_ZIP" -d "$RUNNER_TEMP/Pro"

          echo "Conteudo do Pro.zip:"
          find "$RUNNER_TEMP/Pro" -maxdepth 5 -type f -print | sort

      - name: Localizar Makefile
        shell: bash
        run: |
          set -e

          MAKEFILE="$(find "$RUNNER_TEMP/Pro" \
            -type f \
            -name 'Makefile' \
            -print -quit)"

          if [ -z "$MAKEFILE" ]; then
            echo "ERRO: Pro.zip nao possui Makefile."
            echo
            echo "Estrutura encontrada:"
            find "$RUNNER_TEMP/Pro" -maxdepth 8 -print | sort
            exit 1
          fi

          PROJECT_DIR="$(dirname "$MAKEFILE")"

          echo "Makefile encontrado:"
          echo "$MAKEFILE"

          echo "Projeto:"
          echo "$PROJECT_DIR"

          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"

      - name: Instalar Theos
        shell: bash
        run: |
          set -e

          git clone --depth 1 \
            https://github.com/theos/theos.git \
            "$RUNNER_TEMP/theos"

          echo "THEOS=$RUNNER_TEMP/theos" >> "$GITHUB_ENV"

      - name: Verificar ambiente
        shell: bash
        run: |
          set -e

          export THEOS="$RUNNER_TEMP/theos"

          echo "Xcode:"
          xcodebuild -version

          echo
          echo "SDK:"
          xcrun --sdk iphoneos --show-sdk-path

          echo
          echo "Theos:"
          ls -la "$THEOS"

      - name: Compilar
        shell: bash
        run: |
          set -e

          export THEOS="$RUNNER_TEMP/theos"

          cd "$PROJECT_DIR"

          echo "Build directory:"
          pwd

          echo
          echo "Makefile:"
          cat Makefile

          echo
          echo "Compilando..."

          make clean || true
          make package FINALPACKAGE=1

      - name: Encontrar artefatos
        shell: bash
        run: |
          set -e

          echo "Resultados:"

          find "$PROJECT_DIR" \
            -type f \
            \( \
              -name '*.dylib' \
              -o -name '*.deb' \
              -o -name '*.ipa' \
            \) \
            -print | sort

      - name: Upload do build
        uses: actions/upload-artifact@v4
        with:
          name: pro-build
          path: |
            ${{ env.PROJECT_DIR }}/packages/*
            ${{ env.PROJECT_DIR }}/**/*.dylib
          if-no-files-found: error
