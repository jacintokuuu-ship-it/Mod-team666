name: Build iOSModularHUD MAX IPA

on:
  workflow_dispatch:

permissions:
  contents: read

env:
  THEOS: ${{ github.workspace }}/theos

jobs:
  build:
    name: Build MAX IPA - iOS 15
    runs-on: macos-15

    steps:
      - name: Checkout source
        uses: actions/checkout@v5

      - name: Configure Xcode
        shell: bash
        run: |
          set -Eeuo pipefail

          sudo xcode-select \
            --switch \
            /Applications/Xcode.app/Contents/Developer

          echo "===== XCODE ====="
          xcode-select -p
          xcodebuild -version

          echo
          echo "===== APPLE SDK ====="
          xcrun --sdk iphoneos --show-sdk-path
          xcrun --sdk iphoneos --show-sdk-version

      - name: Install build dependencies
        shell: bash
        run: |
          set -Eeuo pipefail

          brew install \
            ldid \
            xz \
            make \
            perl

      - name: Install Theos
        shell: bash
        run: |
          set -Eeuo pipefail

          rm -rf "$THEOS"

          git clone \
            --recursive \
            --depth 1 \
            https://github.com/theos/theos.git \
            "$THEOS"

          git -C "$THEOS" \
            submodule update \
            --init \
            --recursive

          test -f "$THEOS/makefiles/common.mk"

          echo "THEOS=$THEOS" >> "$GITHUB_ENV"
          echo "$THEOS/bin" >> "$GITHUB_PATH"

          echo "Theos instalado."

      - name: Install Theos iPhoneOS 15.6 SDK
        shell: bash
        run: |
          set -Eeuo pipefail

          mkdir -p "$THEOS/sdks"

          rm -rf "$THEOS/sdks/"*
          rm -rf "$GITHUB_WORKSPACE/theos-sdks"

          git clone \
            --depth 1 \
            https://github.com/theos/sdks.git \
            "$GITHUB_WORKSPACE/theos-sdks"

          if [ ! -d "$GITHUB_WORKSPACE/theos-sdks/iPhoneOS15.6.sdk" ]; then
            echo "::error::iPhoneOS15.6.sdk não encontrado."
            exit 1
          fi

          cp -R \
            "$GITHUB_WORKSPACE/theos-sdks/iPhoneOS15.6.sdk" \
            "$THEOS/sdks/"

          test -d "$THEOS/sdks/iPhoneOS15.6.sdk"

          echo
          echo "SDK instalado:"
          ls -ld "$THEOS/sdks/iPhoneOS15.6.sdk"

      - name: Validate MAX source
        shell: bash
        run: |
          set -Eeuo pipefail

          echo "===== SOURCE ====="
          find App Shared \
            -maxdepth 3 \
            -type f \
            | sort

          echo
          echo "===== REQUIRED FILES ====="

          required=(
            "App/Makefile"
            "App/main.m"
            "App/AppDelegate.h"
            "App/AppDelegate.m"
            "App/Resources/Info.plist"
            "App/Core/FeatureManager.h"
            "App/Core/FeatureManager.mm"
            "App/Menu/Menu.h"
            "App/Menu/Menu.mm"
            "App/Overlay/Overlay.h"
            "App/Overlay/Overlay.mm"
            "Shared/HUDCapabilities.h"
            "Shared/HUDCapabilities.mm"
          )

          for file in "${required[@]}"; do
            if [ ! -f "$file" ]; then
              echo "::error::Arquivo ausente: $file"
              exit 1
            fi

            echo "OK: $file"
          done

          echo
          echo "===== INFO.PLIST ====="

          plutil -lint App/Resources/Info.plist

      - name: Check Makefile
        shell: bash
        run: |
          set -Eeuo pipefail

          echo "===== APP MAKEFILE ====="
          cat App/Makefile

          grep -q \
            'TARGET := iphone:clang:15.6:15.0' \
            App/Makefile

          grep -q \
            'ARCHS := arm64' \
            App/Makefile

          grep -q \
            'PACKAGE_FORMAT := ipa' \
            App/Makefile

          echo
          echo "Makefile OK."

      - name: Build MAX IPA
        working-directory: App
        shell: bash
        run: |
          set -Eeuo pipefail

          echo "======================================"
          echo "       iOSModularHUD MAX IPA"
          echo "======================================"

          echo
          echo "SDK: 15.6"
          echo "TARGET: iphone:clang:15.6:15.0"
          echo "ARCH: arm64"
          echo "FORMAT: ipa"

          echo
          echo "===== CLEAN ====="

          make clean || true

          echo
          echo "===== BUILD ====="

          make package \
            FINALPACKAGE=1 \
            PACKAGE_FORMAT=ipa \
            TARGET=iphone:clang:15.6:15.0 \
            ARCHS=arm64 \
            SDKVERSION=15.6 \
            messages=yes

          echo
          echo "===== GENERATED FILES ====="

          find packages \
            -maxdepth 1 \
            -type f \
            -print

          IPA="$(
            find packages \
              -maxdepth 1 \
              -type f \
              -name '*.ipa' \
              -print \
              -quit
          )"

          if [ -z "$IPA" ]; then
            echo "::error::Nenhuma IPA foi gerada."
            exit 1
          fi

          mkdir -p "$GITHUB_WORKSPACE/output"

          cp "$IPA" \
            "$GITHUB_WORKSPACE/output/iOSModularHUD-MAX.ipa"

          echo
          echo "IPA criada:"
          ls -lh "$GITHUB_WORKSPACE/output/iOSModularHUD-MAX.ipa"

      - name: Validate IPA
        shell: bash
        run: |
          set -Eeuo pipefail

          IPA="output/iOSModularHUD-MAX.ipa"

          if [ ! -s "$IPA" ]; then
            echo "::error::IPA vazia ou inexistente."
            exit 1
          fi

          echo "===== ZIP TEST ====="

          unzip -t "$IPA" >/dev/null

          echo "ZIP OK."

          echo
          echo "===== IPA CONTENT ====="

          unzip -l "$IPA"

          echo
          echo "===== PAYLOAD CHECK ====="

          APP_INFO="$(
            unzip -Z1 "$IPA" \
              | grep -E '^Payload/[^/]+\.app/Info\.plist$' \
              | head -n 1 || true
          )"

          if [ -z "$APP_INFO" ]; then
            echo "::error::Payload/*.app/Info.plist não encontrado."
            exit 1
          fi

          echo "Encontrado:"
          echo "$APP_INFO"

          echo
          echo "IPA validada com sucesso."

      - name: Upload MAX IPA
        uses: actions/upload-artifact@v4
        with:
          name: iOSModularHUD-MAX-IPA-iOS15
          path: output/iOSModularHUD-MAX.ipa
          if-no-files-found: error
          retention-days: 14

      - name: Final information
        shell: bash
        run: |
          echo "======================================"
          echo "          BUILD CONCLUÍDO"
          echo "======================================"
          echo
          echo "Arquivo: iOSModularHUD-MAX.ipa"
          echo "Formato: IPA"
          echo "Arquitetura: arm64"
          echo "SDK: iPhoneOS 15.6"
          echo "Deployment target: iOS 15.0"
          echo "Alvo: iOS 15.8.8"
