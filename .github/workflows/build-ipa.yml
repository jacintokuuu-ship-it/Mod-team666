name: Build LGL-iOS

on:
  workflow_dispatch:

permissions:
  contents: read

env:
  THEOS: ${{ github.workspace }}/theos

jobs:
  build:
    runs-on: macos-14

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Select Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: '16.4'

      - name: Install dependencies
        shell: bash
        run: |
          set -Eeuo pipefail

          brew update
          brew install ldid

      - name: Install Theos
        shell: bash
        run: |
          set -Eeuo pipefail

          git clone --recursive --depth 1 \
            https://github.com/theos/theos.git \
            "$THEOS"

          cd "$THEOS"
          ./bin/install_packages.sh

      - name: Build
        shell: bash
        run: |
          set -Eeuo pipefail

          cd "$GITHUB_WORKSPACE/source/XternalZ-main"

          echo "======================================"
          echo " LGL INSPIRED - THEOS BUILD"
          echo "======================================"

          echo "THEOS: $THEOS"
          echo "Working directory: $(pwd)"

          make clean
          make stage

      - name: Verify build
        shell: bash
        run: |
          set -Eeuo pipefail

          cd "$GITHUB_WORKSPACE/source/XternalZ-main"

          echo "======================================"
          echo " VERIFY BUILD"
          echo "======================================"

          test -d .theos/obj

          echo "Build directory:"
          ls -lah .theos/obj/ || true

          echo ""
          echo "Packages directory:"
          ls -lah packages/ || true

      - name: Verify TIPA
        shell: bash
        run: |
          set -Eeuo pipefail

          cd "$GITHUB_WORKSPACE/source/XternalZ-main"

          echo "======================================"
          echo " VERIFY TIPA"
          echo "======================================"

          test -f packages/LGLInspired.tipa

          echo ""
          echo "TIPA successfully generated:"
          ls -lh packages/LGLInspired.tipa

          echo ""
          echo "File information:"
          file packages/LGLInspired.tipa

      - name: Upload TIPA
        uses: actions/upload-artifact@v4
        with:
          name: LGLInspired-tipa
          path: source/XternalZ-main/packages/LGLInspired.tipa
          if-no-files-found: error
