name: Build iOSModularHUD

on:
  workflow_dispatch:

jobs:
  build:
    name: Build Theos Rootless Package
    runs-on: ubuntu-latest

    steps:
      - name: Baixar repositório
        uses: actions/checkout@v4

      - name: Instalar dependências
        run: |
          sudo apt-get update
          sudo apt-get install -y bash curl git make perl xz-utils unzip fakeroot

      - name: Instalar Theos
        run: |
          export THEOS="$HOME/theos"
          bash -c "$(curl -fsSL https://raw.githubusercontent.com/theos/theos/master/bin/install-theos)"
          echo "THEOS=$THEOS" >> "$GITHUB_ENV"

      - name: Extrair source
        run: |
          rm -rf build-source
          mkdir -p build-source
          unzip -q iOSModularHUD.zip -d build-source

      - name: Localizar projeto Theos
        run: |
          PROJECT_DIR=$(find build-source -name Makefile -type f -print -quit)

          if [ -z "$PROJECT_DIR" ]; then
            echo "::error::Nenhum Makefile do Theos foi encontrado."
            exit 1
          fi

          PROJECT_DIR=$(dirname "$PROJECT_DIR")
          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"

      - name: Compilar pacote rootless
        run: |
          cd "$PROJECT_DIR"
          make clean
          make package FINALPACKAGE=1 THEOS_PACKAGE_SCHEME=rootless PACKAGE_FORMAT=deb

      - name: Copiar pacote
        run: |
          mkdir -p output
          DEB=$(find "$PROJECT_DIR" -type f -name "*.deb" -print -quit)

          if [ -z "$DEB" ]; then
            echo "::error::Nenhum arquivo .deb foi gerado."
            exit 1
          fi

          cp "$DEB" output/iOSModularHUD-rootless.deb

      - name: Disponibilizar pacote
        uses: actions/upload-artifact@v4
        with:
          name: iOSModularHUD-rootless
          path: output/iOSModularHUD-rootless.deb
          if-no-files-found: error
