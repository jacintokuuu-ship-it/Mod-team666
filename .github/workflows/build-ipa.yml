name: Build iOSModularHUD IPA

on:
  workflow_dispatch:

permissions:
  contents: read

env:
  THEOS: ${{ github.workspace }}/theos

jobs:
  build:
    name: Build IPA for iOS 15
    runs-on: macos-15

    steps:

      # ------------------------------------------------------------
      # SOURCE
      # ------------------------------------------------------------

      - name: Checkout
        uses: actions/checkout@v4

      # ------------------------------------------------------------
      # XCODE
      # ------------------------------------------------------------

      - name: Configure Xcode
        shell: bash
        run: |
          set -Eeuo pipefail

          sudo xcode-select \
            --switch \
            /Applications/Xcode.app/Contents/Developer

          echo "Developer:"
          xcode-select -p

          echo
          echo "Xcode:"
          xcodebuild -version

          echo
          echo "iPhoneOS SDK:"
          xcrun --sdk iphoneos --show-sdk-path

          echo
          echo "SDK version:"
          xcrun --sdk iphoneos --show-sdk-version

      # ------------------------------------------------------------
      # DEPENDENCIES
      # ------------------------------------------------------------

      - name: Install dependencies
        shell: bash
        run: |
          set -Eeuo pipefail

          brew install \
            ldid \
            xz \
            make \
            perl

      # ------------------------------------------------------------
      # THEOS
      # ------------------------------------------------------------

      - name: Clone Theos
        shell: bash
        run: |
          set -Eeuo pipefail

          rm -rf "$THEOS"

          git clone \
            --recursive \
            --depth 1 \
            https://github.com/theos/theos.git \
            "$THEOS"

          git -C "$THEOS" \
            submodule update \
            --init \
            --recursive

          test -f "$THEOS/makefiles/common.mk"

          echo "Theos:"
          git -C "$THEOS" rev-parse --short HEAD

          echo "THEOS=$THEOS" >> "$GITHUB_ENV"
          echo "$THEOS/bin" >> "$GITHUB_PATH"

      # ------------------------------------------------------------
      # PATCHED SDK
      # ------------------------------------------------------------

      - name: Install Theos iOS SDK
        shell: bash
        run: |
          set -Eeuo pipefail

          mkdir -p "$THEOS/sdks"

          rm -rf "$THEOS/sdks/"*

          echo "Downloading official Theos SDK repository..."

          git clone \
            --depth 1 \
            https://github.com/theos/sdks.git \
            "$GITHUB_WORKSPACE/theos-sdks"

          test -d \
            "$GITHUB_WORKSPACE/theos-sdks/iPhoneOS15.6.sdk"

          cp -R \
            "$GITHUB_WORKSPACE/theos-sdks/iPhoneOS15.6.sdk" \
            "$THEOS/sdks/"

          test -d \
            "$THEOS/sdks/iPhoneOS15.6.sdk"

          echo
          echo "Installed Theos SDK:"
          ls -ld "$THEOS/sdks/iPhoneOS15.6.sdk"

      # ------------------------------------------------------------
      # SOURCE VALIDATION
      # ------------------------------------------------------------

      - name: Validate App source
        shell: bash
        run: |
          set -Eeuo pipefail

          test -f App/Makefile
          test -f App/main.m
          test -f App/AppDelegate.h
          test -f App/AppDelegate.m
          test -f App/Resources/Info.plist

          test -f App/Core/FeatureManager.h
          test -f App/Core/FeatureManager.mm

          test -f App/Menu/Menu.h
          test -f App/Menu/Menu.mm

          test -f App/Overlay/Overlay.h
          test -f App/Overlay/Overlay.mm

          echo
          echo "===== APP MAKEFILE ====="
          cat App/Makefile

          echo
          echo "===== INFO.PLIST ====="
          cat App/Resources/Info.plist

      # ------------------------------------------------------------
      # BUILD IPA
      # ------------------------------------------------------------

      - name: Build IPA
        working-directory: App
        shell: bash
        env:
          TARGET: iphone:clang:15.6:15.0
          ARCHS: arm64
          PACKAGE_FORMAT: ipa
          FINALPACKAGE: "1"
          SDKVERSION: "15.6"
        run: |
          set -Eeuo pipefail

          echo "========================================"
          echo "        iOSModularHUD IPA BUILD"
          echo "========================================"
          echo
          echo "TARGET=$TARGET"
          echo "ARCHS=$ARCHS"
          echo "SDKVERSION=$SDKVERSION"
          echo "PACKAGE_FORMAT=$PACKAGE_FORMAT"
          echo

          make clean

          make package \
            FINALPACKAGE=1 \
            PACKAGE_FORMAT=ipa \
            TARGET=iphone:clang:15.6:15.0 \
            ARCHS=arm64 \
            SDKVERSION=15.6 \
            messages=yes

          echo
          echo "===== GENERATED PACKAGES ====="

          find packages \
            -maxdepth 1 \
            -type f \
            -print

          IPA="$(
            find packages \
              -maxdepth 1 \
              -type f \
              -name '*.ipa' \
              -print \
              -quit
          )"

          if [ -z "$IPA" ]; then
            echo "::error::Theos não gerou uma IPA."
            exit 1
          fi

          mkdir -p "$GITHUB_WORKSPACE/output"

          cp "$IPA" \
            "$GITHUB_WORKSPACE/output/iOSModularHUD.ipa"

      # ------------------------------------------------------------
      # IPA VALIDATION
      # ------------------------------------------------------------

      - name: Validate IPA
        shell: bash
        run: |
          set -Eeuo pipefail

          IPA="output/iOSModularHUD.ipa"

          test -s "$IPA"

          echo "===== ZIP TEST ====="

          unzip -t "$IPA" >/dev/null

          echo "ZIP OK."

          echo
          echo "===== IPA CONTENT ====="

          unzip -l "$IPA"

          echo
          echo "===== APP CHECK ====="

          unzip -l "$IPA" \
            | grep -E \
              'Payload/[^/]+\.app/Info.plist$'

          echo
          echo "IPA structure OK."

      # ------------------------------------------------------------
      # FINAL INFO
      # ------------------------------------------------------------

      - name: Final result
        shell: bash
        run: |
          set -Eeuo pipefail

          echo
          echo "========================================"
          echo "          BUILD CONCLUÍDO"
          echo "========================================"
          echo
          echo "Arquivo:"
          ls -lh output/iOSModularHUD.ipa
          echo
          echo "Formato: IPA"
          echo "Arquitetura: arm64"
          echo "SDK: iPhoneOS 15.6"
          echo "Deployment target: iOS 15.0"
          echo "Compatibilidade alvo: iOS 15.8.8"
          echo

      # ------------------------------------------------------------
      # ARTIFACT
      # ------------------------------------------------------------

      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: iOSModularHUD-IPA-iOS15
          path: output/iOSModularHUD.ipa
          if-no-files-found: error
          retention-days: 14
