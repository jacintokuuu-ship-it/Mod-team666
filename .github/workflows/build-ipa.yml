name: Build TrollStore TIPA

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - master

env:
  THEOS: ${{ github.workspace }}/theos
  SDK_VERSION: "15.6"
  SOURCE_ZIP: "TROLLTHEOS-FF-arm64e-ESP-BOX-current-1.zip"

jobs:
  build:
    runs-on: macos-14

    steps:

      # ============================================================
      # 1. CHECKOUT
      # ============================================================

      - name: Checkout repository
        uses: actions/checkout@v4


      # ============================================================
      # 2. LOCALIZAR ZIP
      # ============================================================

      - name: Locate source ZIP
        id: source
        shell: bash
        run: |
          set -e

          echo "Arquivos disponíveis:"
          find "$GITHUB_WORKSPACE" -maxdepth 2 -type f -print

          ZIP="$GITHUB_WORKSPACE/$SOURCE_ZIP"

          if [ ! -f "$ZIP" ]; then
            echo "ZIP exato não encontrado: $ZIP"
            echo
            echo "ZIPs encontrados:"
            find "$GITHUB_WORKSPACE" -type f -name "*.zip" -print
            exit 1
          fi

          echo "ZIP encontrado:"
          echo "$ZIP"

          echo "zip=$ZIP" >> "$GITHUB_OUTPUT"


      # ============================================================
      # 3. EXTRAIR ZIP
      # ============================================================

      - name: Extract project ZIP
        id: extract
        shell: bash
        run: |
          set -e

          ZIP="${{ steps.source.outputs.zip }}"
          EXTRACT="$GITHUB_WORKSPACE/project"

          rm -rf "$EXTRACT"
          mkdir -p "$EXTRACT"

          echo "Extraindo:"
          echo "$ZIP"

          unzip -q "$ZIP" -d "$EXTRACT"

          echo
          echo "Estrutura extraída:"
          find "$EXTRACT" -maxdepth 3 -type f -print | head -200

          echo "extract=$EXTRACT" >> "$GITHUB_OUTPUT"


      # ============================================================
      # 4. ENCONTRAR PROJETO REAL
      # ============================================================

      - name: Locate Theos project
        id: project
        shell: bash
        run: |
          set -e

          ROOT="${{ steps.extract.outputs.extract }}"

          MAKEFILE="$(find "$ROOT" \
            -type f \
            -name "Makefile" \
            -not -path "*/theos/*" \
            -print -quit)"

          if [ -z "$MAKEFILE" ]; then
            echo "Nenhum Makefile encontrado após extrair o ZIP."
            exit 1
          fi

          PROJECT_DIR="$(dirname "$MAKEFILE")"

          echo "================================"
          echo "PROJETO:"
          echo "$PROJECT_DIR"
          echo "================================"

          echo "project=$PROJECT_DIR" >> "$GITHUB_OUTPUT"

          echo
          echo "Arquivos do projeto:"
          find "$PROJECT_DIR" -maxdepth 3 -print


      # ============================================================
      # 5. INSTALAR FERRAMENTAS
      # ============================================================

      - name: Install build tools
        shell: bash
        run: |
          set -e

          brew update

          brew install ldid xz


      # ============================================================
      # 6. INSTALAR THEOS
      # ============================================================

      - name: Install Theos
        shell: bash
        run: |
          set -e

          rm -rf "$THEOS"
          rm -rf "$GITHUB_WORKSPACE/theos-sdks"

          git clone --recursive \
            https://github.com/theos/theos.git \
            "$THEOS"

          git clone --depth 1 \
            https://github.com/theos/sdks.git \
            "$GITHUB_WORKSPACE/theos-sdks"

          mkdir -p "$THEOS/sdks"

          if [ ! -d "$GITHUB_WORKSPACE/theos-sdks/iPhoneOS15.6.sdk" ]; then
            echo "iPhoneOS15.6.sdk não encontrado."
            exit 1
          fi

          cp -R \
            "$GITHUB_WORKSPACE/theos-sdks/iPhoneOS15.6.sdk" \
            "$THEOS/sdks/"

          echo
          echo "SDK instalado:"
          ls -ld "$THEOS/sdks/iPhoneOS15.6.sdk"


      # ============================================================
      # 7. ANALISAR E VALIDAR PROJETO EXTRAÍDO
      # ============================================================

      - name: Validate extracted project
        working-directory: ${{ steps.project.outputs.project }}
        shell: bash
        run: |
          set -e

          echo "================================"
          echo "MAKEFILE"
          echo "================================"

          test -f Makefile

          echo
          echo "================================"
          echo "LAYOUT"
          echo "================================"

          if [ -d layout ]; then
            find layout -maxdepth 5 -print
          else
            echo "Diretório layout não encontrado."
          fi

          echo
          echo "================================"
          echo "APP BUNDLES"
          echo "================================"

          find . \
            -type d \
            -name "*.app" \
            -not -path "./.theos/*" \
            -print

          echo
          echo "================================"
          echo "INFO.PLIST"
          echo "================================"

          find . \
            -type f \
            -name "Info.plist" \
            -not -path "./.theos/*" \
            -print


      # ============================================================
      # 8. CORRIGIR TARGET SDK ANTIGO
      # ============================================================

      - name: Normalize SDK target
        working-directory: ${{ steps.project.outputs.project }}
        shell: bash
        run: |
          set -e

          if grep -q "iphone:clang:16.5" Makefile; then
            sed -i '' \
              's/iphone:clang:16\.5/iphone:clang:15.6/g' \
              Makefile
          fi

          echo "TARGET atual:"
          grep -n "TARGET" Makefile || true


      # ============================================================
      # 9. VALIDAR INFO.PLIST DO PROJETO
      # ============================================================

      - name: Validate source Info.plist
        working-directory: ${{ steps.project.outputs.project }}
        shell: bash
        run: |
          set -e

          APP="$(find layout \
            -type d \
            -name "*.app" \
            -print -quit 2>/dev/null || true)"

          if [ -z "$APP" ]; then
            echo "Nenhum .app encontrado em layout."
            exit 1
          fi

          PLIST="$APP/Info.plist"

          if [ ! -f "$PLIST" ]; then
            echo "Info.plist não encontrado:"
            echo "$PLIST"
            exit 1
          fi

          echo "APP:"
          echo "$APP"

          echo
          echo "INFO.PLIST:"
          echo "$PLIST"

          /usr/bin/plutil -lint "$PLIST"

          echo
          echo "CFBundleIdentifier:"
          /usr/libexec/PlistBuddy \
            -c "Print :CFBundleIdentifier" \
            "$PLIST"

          echo
          echo "CFBundleExecutable:"
          /usr/libexec/PlistBuddy \
            -c "Print :CFBundleExecutable" \
            "$PLIST"


      # ============================================================
      # 10. LIMPAR BUILD
      # ============================================================

      - name: Clean
        working-directory: ${{ steps.project.outputs.project }}
        shell: bash
        run: |
          set -e

          make clean \
            SDKVERSION="$SDK_VERSION" \
            || true


      # ============================================================
      # 11. COMPILAR
      # ============================================================

      - name: Compile
        working-directory: ${{ steps.project.outputs.project }}
        shell: bash
        run: |
          set -o pipefail

          echo "================================"
          echo "COMPILANDO"
          echo "================================"

          make all \
            SDKVERSION="$SDK_VERSION" \
            FINALPACKAGE=1 \
            messages=yes \
            2>&1 | tee build.log


      # ============================================================
      # 12. LOCALIZAR APP COMPILADO
      # ============================================================

      - name: Locate compiled APP
        id: compiled
        working-directory: ${{ steps.project.outputs.project }}
        shell: bash
        run: |
          set -e

          APP="$(find .theos/obj \
            -maxdepth 2 \
            -type d \
            -name "*.app" \
            -print -quit)"

          if [ -z "$APP" ]; then
            echo "Nenhum APP compilado encontrado."
            find .theos/obj -maxdepth 4 -print || true
            exit 1
          fi

          echo "APP compilado:"
          echo "$APP"

          if [ ! -f "$APP/Info.plist" ]; then
            echo "ATENÇÃO: APP compilado não possui Info.plist."
          fi

          if [ ! -f "$APP/Fryzz" ]; then
            echo "ATENÇÃO: executável Fryzz não encontrado."
            echo "Conteúdo:"
            find "$APP" -maxdepth 2 -print
            exit 1
          fi

          echo "app=$APP" >> "$GITHUB_OUTPUT"


      # ============================================================
      # 13. CRIAR BUNDLE FINAL
      # ============================================================

      - name: Prepare final TrollStore bundle
        working-directory: ${{ steps.project.outputs.project }}
        shell: bash
        run: |
          set -e

          APP_SRC="${{ steps.compiled.outputs.app }}"

          rm -rf trollstore-stage
          rm -rf trollstore-out

          mkdir -p \
            trollstore-stage/Payload/Fryzz.app

          mkdir -p \
            trollstore-out

          echo "APP COMPILADO:"
          echo "$APP_SRC"

          echo
          echo "Copiando bundle..."

          ditto \
            "$APP_SRC" \
            "trollstore-stage/Payload/Fryzz.app"

          echo
          echo "Garantindo Info.plist..."

          SOURCE_PLIST="$(
            find layout \
              -type f \
              -name "Info.plist" \
              -print -quit
          )"

          if [ -z "$SOURCE_PLIST" ]; then
            echo "Info.plist fonte não encontrado."
            exit 1
          fi

          cp -f \
            "$SOURCE_PLIST" \
            "trollstore-stage/Payload/Fryzz.app/Info.plist"

          echo
          echo "Bundle final:"
          find \
            trollstore-stage/Payload/Fryzz.app \
            -maxdepth 2 \
            -print


      # ============================================================
      # 14. VALIDAR BUNDLE ANTES DO ZIP
      # ============================================================

      - name: Validate final APP
        working-directory: ${{ steps.project.outputs.project }}
        shell: bash
        run: |
          set -e

          APP="trollstore-stage/Payload/Fryzz.app"

          test -d "$APP"
          test -f "$APP/Info.plist"
          test -f "$APP/Fryzz"

          /usr/bin/plutil -lint \
            "$APP/Info.plist"

          python3 - <<'PY'
import plistlib

path = "trollstore-stage/Payload/Fryzz.app/Info.plist"

with open(path, "rb") as f:
    p = plistlib.load(f)

print("CFBundleIdentifier =", p.get("CFBundleIdentifier"))
print("CFBundleExecutable =", p.get("CFBundleExecutable"))
print("CFBundlePackageType =", p.get("CFBundlePackageType"))

assert p.get("CFBundleExecutable") == "Fryzz"
assert p.get("CFBundlePackageType") == "APPL"
PY


      # ============================================================
      # 15. CRIAR TIPA
      # ============================================================

      - name: Create TrollStore TIPA
        working-directory: ${{ steps.project.outputs.project }}
        shell: bash
        run: |
          set -e

          cd trollstore-stage

          COPYFILE_DISABLE=1 \
            zip -qry \
            "../trollstore-out/Fryzz-TrollStore.tipa" \
            Payload

          cd ..

          cp \
            trollstore-out/Fryzz-TrollStore.tipa \
            trollstore-out/Fryzz-TrollStore.ipa


      # ============================================================
      # 16. VALIDAR O ARQUIVO FINAL
      # ============================================================

      - name: Deep validate final TIPA
        working-directory: ${{ steps.project.outputs.project }}
        shell: bash
        run: |
          set -e

          PKG="trollstore-out/Fryzz-TrollStore.tipa"

          test -f "$PKG"

          rm -rf final-check
          mkdir final-check

          unzip -q \
            "$PKG" \
            -d final-check

          echo "================================"
          echo "ESTRUTURA FINAL"
          echo "================================"

          find final-check -maxdepth 4 -print

          echo
          echo "================================"
          echo "VALIDANDO CAMINHO DO TROLLSTORE"
          echo "================================"

          test -d \
            "final-check/Payload"

          test -d \
            "final-check/Payload/Fryzz.app"

          test -f \
            "final-check/Payload/Fryzz.app/Info.plist"

          test -f \
            "final-check/Payload/Fryzz.app/Fryzz"

          /usr/bin/plutil -lint \
            "final-check/Payload/Fryzz.app/Info.plist"

          python3 - <<'PY'
import zipfile
import plistlib

pkg = "trollstore-out/Fryzz-TrollStore.tipa"

with zipfile.ZipFile(pkg, "r") as z:

    names = z.namelist()

    print("ZIP ENTRIES:")
    for n in names:
        print(n)

    required = [
        "Payload/",
        "Payload/Fryzz.app/",
        "Payload/Fryzz.app/Info.plist",
        "Payload/Fryzz.app/Fryzz",
    ]

    for item in required:
        if item not in names:
            raise RuntimeError(
                "FALTA NO TIPA: " + item
            )

    plist = plistlib.loads(
        z.read(
            "Payload/Fryzz.app/Info.plist"
        )
    )

    assert plist.get(
        "CFBundleExecutable"
    ) == "Fryzz"

    assert plist.get(
        "CFBundlePackageType"
    ) == "APPL"

    print()
    print("================================")
    print("TROLLSTORE PACKAGE VALID")
    print("================================")
    print("Payload/Fryzz.app/Info.plist OK")
    print("Payload/Fryzz.app/Fryzz OK")
    print("================================")
PY

          echo
          echo "================================"
          echo "ZIP TEST"
          echo "================================"

          unzip -t "$PKG"


      # ============================================================
      # 17. PUBLICAR SOMENTE O PACOTE VALIDADO
      # ============================================================

      - name: Upload verified package
        uses: actions/upload-artifact@v4
        with:
          name: Fryzz-TrollStore-VERIFIED
          path: |
            ${{ steps.project.outputs.project }}/trollstore-out/Fryzz-TrollStore.tipa
            ${{ steps.project.outputs.project }}/trollstore-out/Fryzz-TrollStore.ipa
            ${{ steps.project.outputs.project }}/build.log
          if-no-files-found: error
