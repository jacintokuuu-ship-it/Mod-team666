name: Build Fryzz TrollStore

on:
  workflow_dispatch:
  push:
    branches: [ main, master ]

env:
  THEOS: ${{ github.workspace }}/theos
  SDK_VERSION: "15.6"

jobs:
  build:
    runs-on: macos-14

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install tools
        run: |
          set -e
          brew update
          brew install ldid xz

      - name: Install Theos + iPhoneOS SDK
        run: |
          set -e

          rm -rf "$THEOS"
          rm -rf "$GITHUB_WORKSPACE/theos-sdks"

          git clone --recursive \
            https://github.com/theos/theos.git \
            "$THEOS"

          git clone --depth 1 \
            https://github.com/theos/sdks.git \
            "$GITHUB_WORKSPACE/theos-sdks"

          mkdir -p "$THEOS/sdks"

          test -d \
            "$GITHUB_WORKSPACE/theos-sdks/iPhoneOS15.6.sdk"

          cp -R \
            "$GITHUB_WORKSPACE/theos-sdks/iPhoneOS15.6.sdk" \
            "$THEOS/sdks/"

          echo "SDK instalado:"
          ls -ld "$THEOS/sdks/iPhoneOS15.6.sdk"

      - name: Verify project
        working-directory: ${{ github.workspace }}/TROLLTHEOS-FF-arm64e-ESP-BOX-current-1
        shell: bash
        run: |
          set -e

          test -f Makefile
          test -d layout
          test -d layout/Applications/Fryzz.app
          test -f layout/Applications/Fryzz.app/Info.plist

          echo "Projeto encontrado:"
          pwd

          echo "Info.plist:"
          /usr/bin/plutil -lint \
            layout/Applications/Fryzz.app/Info.plist

      - name: Build application
        working-directory: ${{ github.workspace }}/TROLLTHEOS-FF-arm64e-ESP-BOX-current-1
        shell: bash
        run: |
          set -o pipefail

          make clean SDKVERSION="$SDK_VERSION" || true

          make all \
            SDKVERSION="$SDK_VERSION" \
            FINALPACKAGE=1 \
            messages=yes \
            2>&1 | tee build.log

      - name: Locate compiled application
        id: app
        working-directory: ${{ github.workspace }}/TROLLTHEOS-FF-arm64e-ESP-BOX-current-1
        shell: bash
        run: |
          set -e

          APP=".theos/obj/Fryzz.app"

          test -d "$APP"
          test -f "$APP/Fryzz"

          echo "APP=$APP" >> "$GITHUB_OUTPUT"

          echo "===== COMPILED APP ====="
          find "$APP" -maxdepth 3 -print

      - name: Validate compiled application
        working-directory: ${{ github.workspace }}/TROLLTHEOS-FF-arm64e-ESP-BOX-current-1
        shell: bash
        run: |
          set -e

          APP=".theos/obj/Fryzz.app"

          test -d "$APP"
          test -f "$APP/Fryzz"

          echo "Executable encontrado:"
          file "$APP/Fryzz"

          echo "Arquiteturas:"
          lipo -info "$APP/Fryzz"

      - name: Construct TrollStore package
        working-directory: ${{ github.workspace }}/TROLLTHEOS-FF-arm64e-ESP-BOX-current-1
        shell: bash
        run: |
          set -e

          APP_SRC=".theos/obj/Fryzz.app"
          OUT="trollstore-out"
          STAGE="trollstore-stage"

          rm -rf "$OUT"
          rm -rf "$STAGE"

          mkdir -p "$OUT"
          mkdir -p "$STAGE/Payload"

          echo "===== COPYING COMPILED APP ====="

          ditto \
            "$APP_SRC" \
            "$STAGE/Payload/Fryzz.app"

          echo "===== INSTALLING PROJECT INFO.PLIST ====="

          cp -f \
            "layout/Applications/Fryzz.app/Info.plist" \
            "$STAGE/Payload/Fryzz.app/Info.plist"

          echo "===== COPYING PROJECT RESOURCES ====="

          for item in "layout/Applications/Fryzz.app/"*; do
            name="$(basename "$item")"

            if [ "$name" != "Info.plist" ]; then
              cp -Rp \
                "$item" \
                "$STAGE/Payload/Fryzz.app/$name"
            fi
          done

          echo "===== VALIDATING FINAL APP ====="

          test -d \
            "$STAGE/Payload/Fryzz.app"

          test -f \
            "$STAGE/Payload/Fryzz.app/Fryzz"

          test -f \
            "$STAGE/Payload/Fryzz.app/Info.plist"

          /usr/bin/plutil -lint \
            "$STAGE/Payload/Fryzz.app/Info.plist"

          python3 - <<'PY'
import plistlib

path = "trollstore-stage/Payload/Fryzz.app/Info.plist"

with open(path, "rb") as f:
    plist = plistlib.load(f)

assert plist.get("CFBundleExecutable") == "Fryzz"
assert plist.get("CFBundleIdentifier") == "com.g1reev7.Fryzz"
assert plist.get("CFBundlePackageType") == "APPL"

print("INFO.PLIST OK")
print("CFBundleExecutable:",
      plist["CFBundleExecutable"])
print("CFBundleIdentifier:",
      plist["CFBundleIdentifier"])
print("CFBundlePackageType:",
      plist["CFBundlePackageType"])
PY

          echo "===== CREATING TIPA ====="

          (
            cd "$STAGE"

            COPYFILE_DISABLE=1 \
              /usr/bin/zip \
              -qry \
              "../$OUT/Fryzz-TrollStore.tipa" \
              Payload
          )

          cp \
            "$OUT/Fryzz-TrollStore.tipa" \
            "$OUT/Fryzz-TrollStore.ipa"

      - name: Verify TIPA structure
        working-directory: ${{ github.workspace }}/TROLLTHEOS-FF-arm64e-ESP-BOX-current-1
        shell: bash
        run: |
          set -e

          PKG="trollstore-out/Fryzz-TrollStore.tipa"

          test -f "$PKG"

          rm -rf final-check
          mkdir final-check

          unzip -q \
            "$PKG" \
            -d final-check

          echo "===== CHECK PAYLOAD ====="

          test -d \
            "final-check/Payload"

          test -d \
            "final-check/Payload/Fryzz.app"

          echo "===== CHECK INFO.PLIST ====="

          test -f \
            "final-check/Payload/Fryzz.app/Info.plist"

          echo "===== CHECK EXECUTABLE ====="

          test -f \
            "final-check/Payload/Fryzz.app/Fryzz"

          /usr/bin/plutil -lint \
            "final-check/Payload/Fryzz.app/Info.plist"

          echo "===== PYTHON ZIP VALIDATION ====="

          python3 - <<'PY'
import zipfile
import plistlib

pkg = "trollstore-out/Fryzz-TrollStore.tipa"

with zipfile.ZipFile(pkg, "r") as z:

    names = z.namelist()

    required = [
        "Payload/",
        "Payload/Fryzz.app/",
        "Payload/Fryzz.app/Info.plist",
        "Payload/Fryzz.app/Fryzz",
    ]

    for path in required:
        assert path in names, \
            f"MISSING ZIP ENTRY: {path}"

    app_entries = [
        n for n in names
        if n.endswith(".app/")
    ]

    assert app_entries == [
        "Payload/Fryzz.app/"
    ], app_entries

    plist_data = z.read(
        "Payload/Fryzz.app/Info.plist"
    )

    plist = plistlib.loads(plist_data)

    assert plist["CFBundleExecutable"] == "Fryzz"
    assert plist["CFBundleIdentifier"] == "com.g1reev7.Fryzz"
    assert plist["CFBundlePackageType"] == "APPL"

    print("================================")
    print("TROLLSTORE PACKAGE: VALID")
    print("================================")
    print("Payload/Fryzz.app/")
    print("Payload/Fryzz.app/Info.plist")
    print("Payload/Fryzz.app/Fryzz")
    print("================================")
    print("ZIP ENTRIES:", len(names))
PY

          echo "===== FINAL ZIP CONTENT ====="

          unzip -l "$PKG"

          echo "===== FINAL ZIP TEST ====="

          unzip -t "$PKG"

      - name: Upload verified TrollStore package
        uses: actions/upload-artifact@v4
        with:
          name: Fryzz-TrollStore-VERIFIED
          path: |
            ${{ github.workspace }}/TROLLTHEOS-FF-arm64e-ESP-BOX-current-1/trollstore-out/Fryzz-TrollStore.tipa
            ${{ github.workspace }}/TROLLTHEOS-FF-arm64e-ESP-BOX-current-1/trollstore-out/Fryzz-TrollStore.ipa
            ${{ github.workspace }}/TROLLTHEOS-FF-arm64e-ESP-BOX-current-1/build.log
          if-no-files-found: error
