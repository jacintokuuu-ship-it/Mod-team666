name: Build Theos Project

on:
  workflow_dispatch:
  push:
    branches:
      - main

env:
  THEOS: ${{ github.workspace }}/theos
  SOURCE_ZIP: TROLLTHEOS-FF-arm64e-ESP-BOX-current-1.zip
  SDK_VERSION: "15.6"

jobs:
  build:
    runs-on: macos-15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Procurar ZIP do projeto
        run: |
          echo "Procurando: $SOURCE_ZIP"

          ZIP_PATH=$(find "$GITHUB_WORKSPACE" \
            -type f \
            -name "$SOURCE_ZIP" \
            -print \
            -quit)

          if [ -z "$ZIP_PATH" ]; then
            echo "::error::Não encontrei $SOURCE_ZIP"
            echo "Arquivos ZIP encontrados:"
            find "$GITHUB_WORKSPACE" -type f -name "*.zip" -print
            exit 1
          fi

          echo "ZIP encontrado: $ZIP_PATH"
          echo "ZIP_PATH=$ZIP_PATH" >> "$GITHUB_ENV"

      - name: Extrair projeto
        run: |
          mkdir -p "$GITHUB_WORKSPACE/project"

          unzip -o "$ZIP_PATH" \
            -d "$GITHUB_WORKSPACE/project"

          echo "Conteúdo do projeto:"
          find "$GITHUB_WORKSPACE/project" -maxdepth 3 -type f | head -200

      - name: Instalar Theos
        run: |
          git clone --depth 1 \
            https://github.com/theos/theos.git \
            "$THEOS"

      - name: Instalar SDK 15.6
        run: |
          git clone --depth 1 \
            https://github.com/theos/sdks.git \
            "$THEOS/sdks"

          echo "SDKs disponíveis:"
          find "$THEOS/sdks" \
            -maxdepth 1 \
            -type d \
            -name "iPhoneOS*.sdk" \
            -print

          if [ ! -d "$THEOS/sdks/iPhoneOS${SDK_VERSION}.sdk" ]; then
            echo "::error::iPhoneOS${SDK_VERSION}.sdk não foi encontrado."
            exit 1
          fi

          echo "SDK selecionado:"
          echo "$THEOS/sdks/iPhoneOS${SDK_VERSION}.sdk"

      - name: Localizar Makefile
        run: |
          MAKEFILE=$(find "$GITHUB_WORKSPACE/project" \
            -name Makefile \
            -type f \
            -print \
            -quit)

          if [ -z "$MAKEFILE" ]; then
            echo "::error::Makefile não encontrado."
            exit 1
          fi

          PROJECT_DIR=$(dirname "$MAKEFILE")

          echo "Makefile: $MAKEFILE"
          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"

      - name: Mostrar configuração do projeto
        working-directory: ${{ env.PROJECT_DIR }}
        run: |
          echo "===== Makefile ====="
          sed -n '1,240p' Makefile

          echo
          echo "===== SDKs Theos ====="
          find "$THEOS/sdks" \
            -maxdepth 1 \
            -type d \
            -name "iPhoneOS*.sdk" \
            -print

      - name: Corrigir referência explícita ao SDK 16.5
        working-directory: ${{ env.PROJECT_DIR }}
        run: |
          if grep -Rqs \
            --exclude-dir=.git \
            -E 'iPhoneOS16\.5\.sdk|SDKVERSION[[:space:]]*=[[:space:]]*16\.5|iphone:clang:16\.5' \
            .; then

            echo "Encontrada referência ao SDK 16.5."

            find . \
              -type f \
              \( -name "Makefile" -o -name "*.mk" -o -name "*.xm" -o -name "*.x" -o -name "*.mm" \) \
              -print0 |
            while IFS= read -r -d '' file; do
              sed -i '' \
                -e 's/iPhoneOS16\.5\.sdk/iPhoneOS15.6.sdk/g' \
                -e 's/SDKVERSION[[:space:]]*=[[:space:]]*16\.5/SDKVERSION = 15.6/g' \
                -e 's/iphone:clang:16\.5/iphone:clang:15.6/g' \
                "$file" || true
            done
          else
            echo "Nenhuma referência explícita ao SDK 16.5 encontrada."
          fi

      - name: Limpar
        working-directory: ${{ env.PROJECT_DIR }}
        run: |
          export THEOS="$THEOS"

          make clean \
            SDKVERSION="$SDK_VERSION" \
            SYSROOT="$THEOS/sdks/iPhoneOS${SDK_VERSION}.sdk" \
            || true

      - name: Compilar
        working-directory: ${{ env.PROJECT_DIR }}
        run: |
          export THEOS="$THEOS"
          export SDKVERSION="$SDK_VERSION"
          export SYSROOT="$THEOS/sdks/iPhoneOS${SDK_VERSION}.sdk"

          echo "================================"
          echo "SDK: $SDKVERSION"
          echo "SYSROOT: $SYSROOT"
          echo "THEOS: $THEOS"
          echo "================================"

          if [ ! -d "$SYSROOT" ]; then
            echo "::error::SDK não encontrado: $SYSROOT"
            exit 1
          fi

          make all \
            SDKVERSION="$SDK_VERSION" \
            SYSROOT="$SYSROOT"

      - name: Listar resultados
        if: always()
        working-directory: ${{ env.PROJECT_DIR }}
        run: |
          echo "===== Arquivos gerados ====="

          find . \
            \( -name "*.app" \
            -o -name "*.deb" \
            -o -name "*.dylib" \
            -o -name "*.framework" \
            -o -name "*.ipa" \) \
            -print

      - name: Procurar APP
        id: find_app
        run: |
          APP=$(find "$GITHUB_WORKSPACE/project" \
            -type d \
            -name "*.app" \
            -print \
            -quit)

          if [ -z "$APP" ]; then
            echo "::warning::Nenhum .app encontrado."
            exit 0
          fi

          echo "APP encontrado: $APP"
          echo "APP_PATH=$APP" >> "$GITHUB_ENV"

      - name: Criar IPA
        if: env.APP_PATH != ''
        run: |
          mkdir -p "$GITHUB_WORKSPACE/ipa/Payload"

          cp -R "$APP_PATH" \
            "$GITHUB_WORKSPACE/ipa/Payload/"

          cd "$GITHUB_WORKSPACE/ipa"

          zip -r \
            "$GITHUB_WORKSPACE/TROLLTHEOS-FF-arm64e-ESP-BOX-current-1.ipa" \
            Payload

      - name: Upload dos artefatos
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: TROLLTHEOS-FF-arm64e-ESP-BOX-current-1-build
          path: |
            ${{ github.workspace }}/project/.theos/packages/*
            ${{ github.workspace }}/*.ipa
          if-no-files-found: warn

      - name: Diagnóstico final
        if: always()
        run: |
          echo "===== SDK ====="
          find "$THEOS/sdks" \
            -maxdepth 1 \
            -type d \
            -name "iPhoneOS*.sdk" \
            -print

          echo
          echo "===== Artefatos ====="
          find "$GITHUB_WORKSPACE/project" \
            -type f \
            \( -name "*.deb" \
            -o -name "*.dylib" \
            -o -name "*.ipa" \) \
            -print
