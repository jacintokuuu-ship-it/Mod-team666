name: Build LGL-iOS

on:
  workflow_dispatch:

permissions:
  contents: read

env:
  THEOS: ${{ github.workspace }}/theos

jobs:
  build:
    runs-on: macos-14

    steps:

      # ==========================================
      # CHECKOUT
      # ==========================================
      - name: Checkout repository
        uses: actions/checkout@v4


      # ==========================================
      # XCODE
      # ==========================================
      - name: Select Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: '16.2.0'


      # ==========================================
      # ENVIRONMENT
      # ==========================================
      - name: Check environment
        shell: bash
        run: |
          set -Eeuo pipefail

          echo "======================================"
          echo " ENVIRONMENT"
          echo "======================================"

          echo ""
          echo "macOS:"
          sw_vers

          echo ""
          echo "Architecture:"
          uname -m

          echo ""
          echo "Xcode:"
          xcodebuild -version

          echo ""
          echo "Clang:"
          clang --version

          echo ""
          echo "Git:"
          git --version

          echo ""
          echo "Homebrew:"
          brew --version


      # ==========================================
      # THEOS
      # ==========================================
      - name: Install Theos
        shell: bash
        run: |
          set -Eeuo pipefail

          echo "======================================"
          echo " INSTALLING THEOS"
          echo "======================================"

          rm -rf "$THEOS"

          git clone \
            --recursive \
            --depth 1 \
            https://github.com/theos/theos.git \
            "$THEOS"

          echo ""
          echo "Theos cloned successfully."

          echo ""
          echo "Running official Theos installer..."

          bash "$THEOS/bin/install-theos"


      # ==========================================
      # VERIFY THEOS
      # ==========================================
      - name: Verify Theos
        shell: bash
        run: |
          set -Eeuo pipefail

          echo "======================================"
          echo " VERIFYING THEOS"
          echo "======================================"

          test -d "$THEOS"
          test -f "$THEOS/makefiles/common.mk"
          test -f "$THEOS/bin/update-theos"

          echo ""
          echo "THEOS:"
          echo "$THEOS"

          echo ""
          echo "Theos version:"
          git -C "$THEOS" rev-parse --short HEAD

          echo ""
          echo "Installed SDKs:"
          find "$THEOS/sdks" -maxdepth 1 -type d -name "*.sdk" -print | sort || true


      # ==========================================
      # VERIFY PROJECT
      # ==========================================
      - name: Verify project
        shell: bash
        run: |
          set -Eeuo pipefail

          PROJECT="$GITHUB_WORKSPACE/source/XternalZ-main"

          echo "======================================"
          echo " VERIFYING PROJECT"
          echo "======================================"

          if [ ! -d "$PROJECT" ]; then
            echo "ERROR: Project directory not found:"
            echo "$PROJECT"
            exit 1
          fi

          if [ ! -f "$PROJECT/Makefile" ]; then
            echo "ERROR: Makefile not found:"
            echo "$PROJECT/Makefile"
            exit 1
          fi

          echo ""
          echo "Project:"
          echo "$PROJECT"

          echo ""
          echo "Makefile:"
          ls -lh "$PROJECT/Makefile"


      # ==========================================
      # BUILD
      # ==========================================
      - name: Build
        shell: bash
        run: |
          set -Eeuo pipefail

          PROJECT="$GITHUB_WORKSPACE/source/XternalZ-main"

          cd "$PROJECT"

          echo "======================================"
          echo " BUILDING PROJECT"
          echo "======================================"

          echo ""
          echo "Working directory:"
          pwd

          echo ""
          echo "THEOS:"
          echo "$THEOS"

          echo ""
          echo "Cleaning..."

          make clean

          echo ""
          echo "Building and staging..."

          make stage


      # ==========================================
      # VERIFY BUILD
      # ==========================================
      - name: Verify build
        shell: bash
        run: |
          set -Eeuo pipefail

          PROJECT="$GITHUB_WORKSPACE/source/XternalZ-main"

          cd "$PROJECT"

          echo "======================================"
          echo " BUILD VERIFICATION"
          echo "======================================"

          echo ""
          echo "Theos object directory:"
          ls -lah .theos/obj/ || true

          echo ""
          echo "Staging directory:"
          ls -lah .theos/_/ || true

          echo ""
          echo "Packages directory:"
          ls -lah packages/ || true


      # ==========================================
      # FIND TIPA
      # ==========================================
      - name: Locate TIPA
        shell: bash
        run: |
          set -Eeuo pipefail

          PROJECT="$GITHUB_WORKSPACE/source/XternalZ-main"

          cd "$PROJECT"

          echo "======================================"
          echo " LOCATING TIPA"
          echo "======================================"

          echo ""
          echo "Searching for .tipa files..."

          find "$PROJECT" -type f -name "*.tipa" -print || true


      # ==========================================
      # VERIFY TIPA
      # ==========================================
      - name: Verify TIPA
        shell: bash
        run: |
          set -Eeuo pipefail

          PROJECT="$GITHUB_WORKSPACE/source/XternalZ-main"

          cd "$PROJECT"

          echo "======================================"
          echo " VERIFYING TIPA"
          echo "======================================"

          if [ ! -f "packages/LGLInspired.tipa" ]; then
            echo ""
            echo "ERROR:"
            echo "packages/LGLInspired.tipa was not generated."

            echo ""
            echo "Available packages:"
            find packages -maxdepth 2 -type f -print 2>/dev/null || true

            echo ""
            echo "Available TIPA files:"
            find . -type f -name "*.tipa" -print || true

            exit 1
          fi

          echo ""
          echo "SUCCESS!"
          echo ""
          echo "TIPA:"
          ls -lh packages/LGLInspired.tipa

          echo ""
          echo "File type:"
          file packages/LGLInspired.tipa

          echo ""
          echo "SHA256:"
          shasum -a 256 packages/LGLInspired.tipa


      # ==========================================
      # UPLOAD TIPA
      # ==========================================
      - name: Upload TIPA
        uses: actions/upload-artifact@v4
        with:
          name: LGLInspired-tipa
          path: source/XternalZ-main/packages/LGLInspired.tipa
          if-no-files-found: error
          retention-days: 7


      # ==========================================
      # UPLOAD DIAGNOSTICS
      # ==========================================
      - name: Upload build diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: LGLInspired-build-diagnostics
          path: |
            source/XternalZ-main/.theos/obj
            source/XternalZ-main/.theos/_/
          if-no-files-found: ignore
          retention-days: 3
