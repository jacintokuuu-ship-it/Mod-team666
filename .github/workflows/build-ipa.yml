name: Build iOSModularHUD

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build DEB + IPA + TIPA
    runs-on: macos-15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Verify Xcode
        shell: bash
        run: |
          set -euo pipefail
          sw_vers
          xcodebuild -version
          xcrun --sdk iphoneos --show-sdk-path

      - name: Install dependencies
        shell: bash
        run: |
          set -euo pipefail
          brew install dpkg

      - name: Install clean Theos
        shell: bash
        run: |
          set -euo pipefail

          export THEOS="$HOME/theos"
          rm -rf "$THEOS"

          bash -c "$(curl -fsSL https://raw.githubusercontent.com/theos/theos/master/bin/install-theos)"

          test -f "$THEOS/makefiles/common.mk"
          test -d "$THEOS/vendor/mod/rootless"
          test -x "$THEOS/bin/ldid"

          echo "THEOS=$THEOS" >> "$GITHUB_ENV"
          echo "$THEOS/bin" >> "$GITHUB_PATH"

      - name: Verify source
        shell: bash
        run: |
          set -euo pipefail

          test -f Tweak/Makefile
          test -f Tweak/control
          test -f Tweak/Tweak.mm
          test -f Tweak/iOSModularHUD.plist

          test -f App/Makefile
          test -f App/main.m
          test -f App/AppDelegate.m
          test -f App/Resources/Info.plist

          echo "Source OK"

      # =========================
      # JAILBREAK ROOTLESS
      # =========================

      - name: Build rootless DEB
        working-directory: Tweak
        shell: bash
        run: |
          set -euo pipefail

          make clean

          env \
            THEOS_PACKAGE_SCHEME=rootless \
            PACKAGE_FORMAT=deb \
            make package FINALPACKAGE=1 messages=yes

          DEB="$(find packages -maxdepth 1 -type f -name '*.deb' -print -quit)"

          test -n "$DEB"

          mkdir -p "$GITHUB_WORKSPACE/output"

          cp "$DEB" \
            "$GITHUB_WORKSPACE/output/iOSModularHUD-rootless.deb"

      - name: Validate DEB
        shell: bash
        run: |
          set -euo pipefail

          PKG="output/iOSModularHUD-rootless.deb"

          test -s "$PKG"

          dpkg-deb -I "$PKG"
          dpkg-deb -c "$PKG" | tee deb-contents.txt

          grep -q 'var/jb/' deb-contents.txt
          grep -q 'Library/MobileSubstrate/DynamicLibraries' deb-contents.txt

      # =========================
      # TROLLSTORE APP
      # =========================

      - name: Build standalone IPA
        working-directory: App
        shell: bash
        run: |
          set -euo pipefail

          make clean

          env \
            PACKAGE_FORMAT=ipa \
            make package FINALPACKAGE=1 messages=yes

          IPA="$(find packages -maxdepth 1 -type f -name '*.ipa' -print -quit)"

          test -n "$IPA"

          mkdir -p "$GITHUB_WORKSPACE/output"

          cp "$IPA" \
            "$GITHUB_WORKSPACE/output/iOSModularHUD.ipa"

      - name: Create TIPA
        shell: bash
        run: |
          set -euo pipefail

          test -s output/iOSModularHUD.ipa

          cp \
            output/iOSModularHUD.ipa \
            output/iOSModularHUD.tipa

      - name: Validate IPA
        shell: bash
        run: |
          set -euo pipefail

          for FILE in \
            output/iOSModularHUD.ipa \
            output/iOSModularHUD.tipa
          do
            test -s "$FILE"

            unzip -t "$FILE" >/dev/null

            unzip -l "$FILE" |
              grep -E 'Payload/[^/]+\.app/Info.plist$'

            echo "Validado: $FILE"
          done

      # =========================
      # ARTIFACTS
      # =========================

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: iOSModularHUD-builds
          path: |
            output/iOSModularHUD-rootless.deb
            output/iOSModularHUD.ipa
            output/iOSModularHUD.tipa
          if-no-files-found: error
          retention-days: 14
