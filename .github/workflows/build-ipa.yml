name: Build LGL-iOS

on:
  workflow_dispatch:

permissions:
  contents: read

env:
  THEOS: ${{ github.workspace }}/theos
  SOURCE_ZIP: LGL-Inspired-Reorganized-iOS15.zip
  SDK_VERSION: "15.6"

jobs:
  build:
    name: Build Theos Package
    runs-on: macos-15

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Locate and extract source
        shell: bash
        run: |
          set -Eeuo pipefail

          ZIP=""

          if [ -f "$SOURCE_ZIP" ]; then
            ZIP="$SOURCE_ZIP"
          else
            ZIP="$(find "$GITHUB_WORKSPACE" -maxdepth 5 \
              -type f -name "$SOURCE_ZIP" -print -quit)"
          fi

          if [ -z "$ZIP" ]; then
            echo "::error::ZIP não encontrado: $SOURCE_ZIP"
            exit 1
          fi

          rm -rf "$GITHUB_WORKSPACE/source"
          mkdir -p "$GITHUB_WORKSPACE/source"

          unzip -q "$ZIP" -d "$GITHUB_WORKSPACE/source"

          APP_MAKEFILE="$(find "$GITHUB_WORKSPACE/source" \
            -type f -name 'Makefile' -print -quit)"

          if [ -z "$APP_MAKEFILE" ]; then
            echo "::error::Makefile não encontrado dentro do ZIP."
            exit 1
          fi

          APP_DIR="$(dirname "$APP_MAKEFILE")"

          echo "APP_DIR=$APP_DIR" >> "$GITHUB_ENV"

          echo "Projeto encontrado:"
          echo "$APP_DIR"

      - name: Configure Xcode
        shell: bash
        run: |
          set -Eeuo pipefail

          sudo xcode-select \
            --switch /Applications/Xcode.app/Contents/Developer

          xcodebuild -version

      - name: Install dependencies
        shell: bash
        run: |
          set -Eeuo pipefail

          brew install ldid xz perl || true

      - name: Install Theos
        shell: bash
        run: |
          set -Eeuo pipefail

          rm -rf "$THEOS"

          git clone \
            --recursive \
            --depth 1 \
            https://github.com/theos/theos.git \
            "$THEOS"

          git -C "$THEOS" submodule update \
            --init \
            --recursive

          echo "$THEOS/bin" >> "$GITHUB_PATH"

      - name: Install iOS SDK
        shell: bash
        run: |
          set -Eeuo pipefail

          mkdir -p "$THEOS/sdks"

          rm -rf "$GITHUB_WORKSPACE/theos-sdks"

          git clone \
            --depth 1 \
            https://github.com/theos/sdks.git \
            "$GITHUB_WORKSPACE/theos-sdks"

          if [ ! -d "$GITHUB_WORKSPACE/theos-sdks/iPhoneOS15.6.sdk" ]; then
            echo "::error::iPhoneOS15.6.sdk não encontrado."
            ls -la "$GITHUB_WORKSPACE/theos-sdks"
            exit 1
          fi

          cp -R \
            "$GITHUB_WORKSPACE/theos-sdks/iPhoneOS15.6.sdk" \
            "$THEOS/sdks/"

      - name: Validate project
        shell: bash
        run: |
          set -Eeuo pipefail

          echo "======================================"
          echo " PROJETO"
          echo "======================================"

          echo "Diretório:"
          echo "$APP_DIR"

          echo
          echo "Makefile:"
          cat "$APP_DIR/Makefile"

          echo
          echo "Arquivos:"
          find "$APP_DIR" -maxdepth 4 -type f | sort

      - name: Validate player-count sources
        shell: bash
        run: |
          set -Eeuo pipefail
          echo "======================================"
          echo " PLAYER COUNT VALIDATION "
          echo "======================================"
          if find "$APP_DIR" -type f \\
            \( -name '*.mm' -o -name '*.m' -o -name '*.h' -o -name '*.cpp' -o -name '*.hpp' \) \\
            -print0 | xargs -0 grep -nE "PlayerCount|PhotonNetwork|Teste|MenuFuncaoTeste" >/dev/null 2>&1; then
            echo "Player/menu related symbols found."
          else
            echo "::warning::Nenhuma referência de player/menu encontrada; o build continuará para permitir diagnóstico do Makefile."
          fi

      - name: Build package
        working-directory: ${{ env.APP_DIR }}
        shell: bash
        run: |
          set -Eeuo pipefail

          echo "======================================"
          echo " LGL INSPIRED ULTIMATE - THEOS BUILD "
          echo "======================================"

          make clean || true

          make package \
            SDKVERSION="$SDK_VERSION" \
            messages=yes

      - name: Locate generated package
        working-directory: ${{ env.APP_DIR }}
        shell: bash
        run: |
          set -Eeuo pipefail

          echo "======================================"
          echo " PACOTES GERADOS "
          echo "======================================"

          DEB="$(find "$PWD/packages" \
            -type f -name '*.deb' -print -quit)"

          if [ -z "$DEB" ]; then
            echo "::error::Nenhum arquivo .deb foi gerado."

            echo
            echo "Conteúdo do projeto:"
            find "$PWD" -maxdepth 5 -print | sort

            exit 1
          fi

          echo "Pacote encontrado:"
          echo "$DEB"

          echo "DEB_PATH=$DEB" >> "$GITHUB_ENV"

      - name: Upload Theos package
        uses: actions/upload-artifact@v4
        with:
          name: LGL-Inspired-Ultimate-Standoff2-Players-v2
          path: ${{ env.DEB_PATH }}
          if-no-files-found: error
          retention-days: 14
