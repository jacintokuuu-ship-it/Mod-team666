name: Build iOSModularHUD MAX IPA

on:
  workflow_dispatch:

permissions:
  contents: read

env:
  THEOS: ${{ github.workspace }}/theos
  SOURCE_ZIP: iOSModularHUD-max-ipa-fixed.zip

jobs:
  build:
    name: Build MAX IPA - iOS 15
    runs-on: macos-15

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Locate and extract MAX source
        shell: bash
        run: |
          set -Eeuo pipefail

          echo "===== REPOSITORY ====="
          find . -maxdepth 3 -type f -not -path './.git/*' | sort

          echo
          echo "===== SEARCH ZIP ====="

          ZIP=""

          if [ -f "$SOURCE_ZIP" ]; then
            ZIP="$SOURCE_ZIP"
          else
            ZIP="$(find . -maxdepth 4 -type f -name "$SOURCE_ZIP" -print -quit)"
          fi

          if [ -z "$ZIP" ]; then
            echo "::error::Não encontrei $SOURCE_ZIP"
            exit 1
          fi

          echo "ZIP encontrado:"
          echo "$ZIP"

          rm -rf "$GITHUB_WORKSPACE/source"
          mkdir -p "$GITHUB_WORKSPACE/source"

          echo
          echo "===== EXTRAINDO ====="

          unzip -q "$ZIP" -d "$GITHUB_WORKSPACE/source"

          echo
          echo "===== CONTEÚDO EXTRAÍDO ====="

          find "$GITHUB_WORKSPACE/source" \
            -maxdepth 5 \
            -type f \
            | sort

          echo
          echo "===== LOCALIZANDO APP ====="

          APP_MAKEFILE="$(
            find "$GITHUB_WORKSPACE/source" \
              -type f \
              -path '*/App/Makefile' \
              -print \
              -quit
          )"

          if [ -z "$APP_MAKEFILE" ]; then
            echo "::error::App/Makefile não encontrado dentro do ZIP."
            exit 1
          fi

          APP_DIR="$(dirname "$APP_MAKEFILE")"

          PROJECT_ROOT="$(
            cd "$APP_DIR/.." >/dev/null 2>&1
            pwd
          )"

          if [ ! -d "$PROJECT_ROOT/Shared" ]; then
            echo "::error::Pasta Shared/ não encontrada junto com App/."
            exit 1
          fi

          echo
          echo "App:"
          echo "$APP_DIR"

          echo
          echo "Projeto:"
          echo "$PROJECT_ROOT"

          echo "PROJECT_ROOT=$PROJECT_ROOT" >> "$GITHUB_ENV"
          echo "APP_DIR=$APP_DIR" >> "$GITHUB_ENV"

      - name: Configure Xcode
        shell: bash
        run: |
          set -Eeuo pipefail

          sudo xcode-select --switch /Applications/Xcode.app/Contents/Developer

          echo "===== XCODE ====="
          xcode-select -p
          xcodebuild -version

          echo
          echo "===== APPLE SDK ====="
          xcrun --sdk iphoneos --show-sdk-path
          xcrun --sdk iphoneos --show-sdk-version

      - name: Install dependencies
        shell: bash
        run: |
          set -Eeuo pipefail

          brew install ldid xz make perl || true

          echo
          echo "===== DEPENDENCIES ====="

          command -v ldid
          ldid -h >/dev/null 2>&1 || true

          command -v make
          command -v xz

      - name: Install Theos
        shell: bash
        run: |
          set -Eeuo pipefail

          rm -rf "$THEOS"

          git clone \
            --recursive \
            --depth 1 \
            https://github.com/theos/theos.git \
            "$THEOS"

          git -C "$THEOS" submodule update --init --recursive

          test -f "$THEOS/makefiles/common.mk"

          echo "THEOS=$THEOS" >> "$GITHUB_ENV"
          echo "$THEOS/bin" >> "$GITHUB_PATH"

          echo
          echo "===== THEOS ====="
          echo "Theos instalado."

      - name: Install Theos iPhoneOS 15.6 SDK
        shell: bash
        run: |
          set -Eeuo pipefail

          mkdir -p "$THEOS/sdks"

          rm -rf "$THEOS/sdks/"*
          rm -rf "$GITHUB_WORKSPACE/theos-sdks"

          git clone \
            --depth 1 \
            https://github.com/theos/sdks.git \
            "$GITHUB_WORKSPACE/theos-sdks"

          SDK="$GITHUB_WORKSPACE/theos-sdks/iPhoneOS15.6.sdk"

          if [ ! -d "$SDK" ]; then
            echo "::error::iPhoneOS15.6.sdk não encontrado."
            exit 1
          fi

          cp -R "$SDK" "$THEOS/sdks/"

          test -d "$THEOS/sdks/iPhoneOS15.6.sdk"

          echo
          echo "===== THEOS SDK ====="
          ls -ld "$THEOS/sdks/iPhoneOS15.6.sdk"

      - name: Validate extracted MAX source
        shell: bash
        run: |
          set -Eeuo pipefail

          echo "===== SOURCE ====="

          find "$PROJECT_ROOT" \
            -maxdepth 4 \
            -type f \
            | sort

          echo
          echo "===== REQUIRED FILES ====="

          required=(
            "$PROJECT_ROOT/App/Makefile"
            "$PROJECT_ROOT/App/main.m"
            "$PROJECT_ROOT/App/AppDelegate.h"
            "$PROJECT_ROOT/App/AppDelegate.m"
            "$PROJECT_ROOT/App/Resources/Info.plist"
            "$PROJECT_ROOT/App/Core/FeatureManager.h"
            "$PROJECT_ROOT/App/Core/FeatureManager.mm"
            "$PROJECT_ROOT/App/Menu/Menu.h"
            "$PROJECT_ROOT/App/Menu/Menu.mm"
            "$PROJECT_ROOT/App/Overlay/Overlay.h"
            "$PROJECT_ROOT/App/Overlay/Overlay.mm"
            "$PROJECT_ROOT/Shared/HUDCapabilities.h"
            "$PROJECT_ROOT/Shared/HUDCapabilities.mm"
          )

          for file in "${required[@]}"; do
            if [ ! -f "$file" ]; then
              echo "::error::Arquivo ausente: $file"
              exit 1
            fi

            echo "OK: $file"
          done

          echo
          echo "===== INFO.PLIST ====="

          plutil -lint \
            "$PROJECT_ROOT/App/Resources/Info.plist"

      - name: Prepare Theos build
        shell: bash
        run: |
          set -Eeuo pipefail

          echo "===== MAKEFILE ====="

          cat "$PROJECT_ROOT/App/Makefile"

          echo
          echo "===== CHECK SETTINGS ====="

          grep -q 'TARGET := iphone:clang:15.6:15.0' \
            "$PROJECT_ROOT/App/Makefile"

          grep -q 'ARCHS := arm64' \
            "$PROJECT_ROOT/App/Makefile"

          grep -q 'PACKAGE_FORMAT := ipa' \
            "$PROJECT_ROOT/App/Makefile"

          echo
          echo "Makefile OK."

      - name: Build iOS application
        working-directory: ${{ env.APP_DIR }}
        shell: bash
        run: |
          set -Eeuo pipefail

          echo "======================================"
          echo "       iOSModularHUD MAX IPA"
          echo "======================================"

          echo
          echo "SDK: 15.6"
          echo "TARGET: iphone:clang:15.6:15.0"
          echo "ARCH: arm64"

          echo
          echo "===== CLEAN ====="

          make clean || true

          echo
          echo "===== COMPILE APPLICATION ====="

          make all \
            TARGET=iphone:clang:15.6:15.0 \
            ARCHS=arm64 \
            SDKVERSION=15.6 \
            messages=yes

          echo
          echo "===== CHECK APP BUNDLE ====="

          APP="$PWD/.theos/obj/iOSModularHUD.app"

          if [ ! -d "$APP" ]; then
            echo "::error::iOSModularHUD.app não foi gerado."
            exit 1
          fi

          if [ ! -f "$APP/iOSModularHUD" ]; then
            echo "::error::Executável iOSModularHUD não encontrado."
            exit 1
          fi

          if [ ! -f "$APP/Info.plist" ]; then
            echo "::error::Info.plist não encontrado dentro do .app."
            exit 1
          fi

          echo
          echo "===== APP CONTENT ====="

          find "$APP" \
            -maxdepth 2 \
            -type f \
            | sort

          echo
          echo "===== CREATE IPA ====="

          rm -rf "$GITHUB_WORKSPACE/output"

          mkdir -p \
            "$GITHUB_WORKSPACE/output/Payload"

          cp -R \
            "$APP" \
            "$GITHUB_WORKSPACE/output/Payload/iOSModularHUD.app"

          cd "$GITHUB_WORKSPACE/output"

          /usr/bin/ditto \
            -c \
            -k \
            --sequesterRsrc \
            --keepParent \
            Payload \
            iOSModularHUD-MAX.ipa

          rm -rf Payload

          echo
          echo "===== IPA CREATED ====="

          ls -lh \
            "$GITHUB_WORKSPACE/output/iOSModularHUD-MAX.ipa"

      - name: Validate IPA
        shell: bash
        run: |
          set -Eeuo pipefail

          IPA="$GITHUB_WORKSPACE/output/iOSModularHUD-MAX.ipa"

          echo "===== FILE ====="

          test -s "$IPA"

          ls -lh "$IPA"

          echo
          echo "===== ZIP TEST ====="

          unzip -t "$IPA" >/dev/null

          echo "ZIP OK."

          echo
          echo "===== IPA CONTENT ====="

          unzip -l "$IPA"

          echo
          echo "===== PAYLOAD CHECK ====="

          APP_INFO="$(
            unzip -Z1 "$IPA" \
              | grep -E '^Payload/[^/]+\.app/Info\.plist$' \
              | head -n 1 \
              || true
          )"

          if [ -z "$APP_INFO" ]; then
            echo "::error::Payload/*.app/Info.plist não encontrado."
            exit 1
          fi

          echo "Encontrado:"
          echo "$APP_INFO"

          echo
          echo "===== EXECUTABLE CHECK ====="

          APP_EXEC="$(
            unzip -Z1 "$IPA" \
              | grep -E '^Payload/[^/]+\.app/iOSModularHUD$' \
              | head -n 1 \
              || true
          )"

          if [ -z "$APP_EXEC" ]; then
            echo "::error::Executável iOSModularHUD não encontrado dentro da IPA."
            exit 1
          fi

          echo "Encontrado:"
          echo "$APP_EXEC"

          echo
          echo "IPA validada com sucesso."

      - name: Upload MAX IPA
        uses: actions/upload-artifact@v4
        with:
          name: iOSModularHUD-MAX-IPA-iOS15
          path: output/iOSModularHUD-MAX.ipa
          if-no-files-found: error
          retention-days: 14

      - name: Build result
        shell: bash
        run: |
          echo "======================================"
          echo "          BUILD CONCLUÍDO"
          echo "======================================"
          echo
          echo "Arquivo: iOSModularHUD-MAX.ipa"
          echo "Formato: IPA"
          echo "Arquitetura: arm64"
          echo "SDK: iPhoneOS 15.6"
          echo "Deployment target: iOS 15.0"
          echo "Build: Theos + Xcode"
