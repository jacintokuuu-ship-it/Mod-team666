name: Build LGL-iOS

on:
  workflow_dispatch:

permissions:
  contents: read

env:
  THEOS: ${{ github.workspace }}/theos

jobs:
  build:
    runs-on: macos-14

    steps:

      - name: Checkout
        uses: actions/checkout@v4


      - name: Select Xcode 16.2
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: '16.2.0'


      - name: Check Xcode SDKs
        shell: bash
        run: |
          set -Eeuo pipefail

          echo "======================================"
          echo " XCODE"
          echo "======================================"

          xcodebuild -version

          echo ""
          echo "Available SDKs:"
          xcodebuild -showsdks

          echo ""
          echo "Xcode path:"
          xcode-select -p

          echo ""
          echo "iPhoneOS SDK:"
          xcrun --sdk iphoneos --show-sdk-path


      - name: Install dependencies
        shell: bash
        run: |
          set -Eeuo pipefail

          echo "======================================"
          echo " DEPENDENCIES"
          echo "======================================"

          brew update

          if ! command -v ldid >/dev/null 2>&1; then
            brew install ldid
          fi

          echo ""
          echo "ldid:"
          ldid -V || true


      - name: Install Theos
        shell: bash
        run: |
          set -Eeuo pipefail

          echo "======================================"
          echo " THEOS"
          echo "======================================"

          rm -rf "$THEOS"

          git clone \
            --recursive \
            --depth 1 \
            https://github.com/theos/theos.git \
            "$THEOS"

          echo ""
          echo "Theos installed."

          test -f "$THEOS/makefiles/common.mk"

          echo ""
          echo "Theos commit:"
          git -C "$THEOS" rev-parse --short HEAD


      - name: Configure Theos SDK
        shell: bash
        run: |
          set -Eeuo pipefail

          echo "======================================"
          echo " CONFIGURING SDK"
          echo "======================================"

          SDK_PATH="$(xcrun --sdk iphoneos --show-sdk-path)"

          echo "Xcode iPhoneOS SDK:"
          echo "$SDK_PATH"

          mkdir -p "$THEOS/sdks"

          SDK_NAME="$(basename "$SDK_PATH")"

          echo ""
          echo "SDK name:"
          echo "$SDK_NAME"

          echo ""
          echo "Linking Xcode SDK into Theos..."

          ln -sfn "$SDK_PATH" "$THEOS/sdks/$SDK_NAME"

          echo ""
          echo "Theos SDK directory:"
          ls -lah "$THEOS/sdks"


      - name: Verify project
        shell: bash
        run: |
          set -Eeuo pipefail

          PROJECT="$GITHUB_WORKSPACE/source/XternalZ-main"

          echo "======================================"
          echo " PROJECT"
          echo "======================================"

          test -d "$PROJECT"
          test -f "$PROJECT/Makefile"

          echo ""
          echo "Project:"
          echo "$PROJECT"

          echo ""
          echo "Makefile:"
          ls -lh "$PROJECT/Makefile"


      - name: Build
        shell: bash
        run: |
          set -Eeuo pipefail

          PROJECT="$GITHUB_WORKSPACE/source/XternalZ-main"

          cd "$PROJECT"

          echo "======================================"
          echo " BUILD"
          echo "======================================"

          echo ""
          echo "THEOS:"
          echo "$THEOS"

          echo ""
          echo "SDKs:"
          ls -lah "$THEOS/sdks"

          echo ""
          echo "Cleaning..."

          make clean

          echo ""
          echo "Compiling..."

          make stage


      - name: Verify output
        shell: bash
        run: |
          set -Eeuo pipefail

          PROJECT="$GITHUB_WORKSPACE/source/XternalZ-main"

          cd "$PROJECT"

          echo "======================================"
          echo " OUTPUT"
          echo "======================================"

          echo ""
          echo "Packages:"
          ls -lah packages/ || true

          echo ""
          echo "TIPA files:"
          find . -type f -name "*.tipa" -print


      - name: Verify TIPA
        shell: bash
        run: |
          set -Eeuo pipefail

          PROJECT="$GITHUB_WORKSPACE/source/XternalZ-main"

          cd "$PROJECT"

          TIPA="packages/LGLInspired.tipa"

          echo "======================================"
          echo " TIPA VERIFICATION"
          echo "======================================"

          if [ ! -f "$TIPA" ]; then
            echo ""
            echo "ERROR: $TIPA was not generated."

            echo ""
            echo "Searching entire project:"
            find . -type f \( -name "*.tipa" -o -name "*.deb" -o -name "*.dylib" \) -print

            exit 1
          fi

          echo ""
          echo "TIPA generated successfully:"
          ls -lh "$TIPA"

          echo ""
          echo "Type:"
          file "$TIPA"

          echo ""
          echo "SHA256:"
          shasum -a 256 "$TIPA"


      - name: Upload TIPA
        uses: actions/upload-artifact@v4
        with:
          name: LGLInspired-tipa
          path: source/XternalZ-main/packages/LGLInspired.tipa
          if-no-files-found: error
          retention-days: 7


      - name: Upload diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: LGLInspired-diagnostics
          path: |
            source/XternalZ-main/.theos
          if-no-files-found: ignore
          retention-days: 3
